<style>
  :root {
    --nuit: #17120e; --mur: #211a14; --bois: #5b3c25; --bois-sombre: #3a2616;
    --papier: #efe4cf; --encre: #e9dcc3; --encre-douce: #b5a487; --encre-pale: #7d6f5a; --or: #d6a546;

    --serif: "Cormorant Garamond", Georgia, serif; --sans: Inter, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--nuit); color: var(--encre); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
  header { padding: 40px 32px 20px; max-width: 1400px; margin: 0 auto; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 52px; line-height: 1; margin: 0 0 8px; }
  .sous-titre { color: var(--encre-douce); max-width: 760px; margin: 0; }
  .barre { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-top: 24px; }
  .compteurs { display: flex; gap: 8px; flex-wrap: wrap; }
  .compteur { border: 1px solid #3b2f24; border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--encre-douce); }
  .compteur b { color: var(--encre); font-weight: 500; }
  .temps { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 260px; font-size: 13px; color: var(--encre-douce); }
  .temps input { flex: 1; accent-color: var(--or); }
  button { font: inherit; font-size: 13px; background: transparent; color: var(--encre); border: 1px solid #4a3b2d; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--or); color: var(--or); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; padding: 0 32px 60px; max-width: 1400px; margin: 0 auto; align-items: start; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; padding: 0 16px 40px; } header { padding: 28px 16px 16px; } h1 { font-size: 40px; } }

    text-overflow: ellipsis; display: block; text-align: left; line-height: 1; padding-top: 2px; }
  .dos.oeuvre::before, .dos.oeuvre::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: var(--or); opacity: .85; }

  .rangee .lib i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
  .briques { display: flex; flex-wrap: wrap; gap: 3px; padding-bottom: 6px; border-bottom: 3px solid var(--bois-sombre); min-height: 24px; align-items: flex-end; }

    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.3); }
  .brique:hover { transform: translateY(-3px) scale(1.15); }
  .attenue [data-k]:not(.lie) { opacity: .16; }
  .choisi { outline: 2px solid var(--or); outline-offset: 2px; }
  .dos.choisi { transform: translateY(-8px); }
  .vide-rayon { color: var(--encre-pale); font-size: 13px; font-style: italic; padding: 40px 4px; }

  aside h2 { font-family: var(--serif); font-size: 32px; line-height: 1.05; font-weight: 600; margin: 4px 0 10px; }
  aside h3 { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 22px 0 6px; }
  aside .meta { font-size: 13px; color: #6c5a45; margin-bottom: 14px; }
  aside .badge { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #8a6420; }
  aside .texte p { margin: 0 0 12px; } aside .texte ul { padding-left: 18px; margin: 0 0 12px; }
  .ligne-piece { display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid #d8c9ac; font-size: 14px; cursor: pointer; }
  .ligne-piece:first-of-type { border-top: 0; }
  .ligne-piece i { width: 16px; height: 12px; border-radius: 2px; background: var(--c); margin-top: 5px; }
  .ligne-piece small { display: block; color: #85714f; font-size: 12px; }
  .lien { color: #8a6420; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .vide { color: #6c5a45; font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1.45; margin: 0; }
  footer { text-align: center; color: var(--encre-pale); font-size: 12px; padding-bottom: 30px; }
</style>

<body>
<header>
  <h1>La Bibliothèque</h1>
  <p class="sous-titre">Au rez-de-chaussée, de vrais mangas. Chacun est extrait en cinq pièces brutes, rangées dans la réserve. À l'étage, des œuvres originales assemblées à partir de trois de ces pièces.</p>
  <div class="barre">
    <div class="compteurs" id="compteurs"></div>
    <div class="temps">
      <button id="lecture">▶ Timelapse</button>
      <input type="range" id="curseur" min="0" aria-label="Moment de la construction">
      <span id="date"></span>
    </div>
  </div>
</header>
<main>
  <div id="batiment"><svg id="liens"></svg><div id="etages"></div></div>
  <aside id="fiche"><p class="vide">Choisis un livre ou une pièce. Ce qui lui est lié s'éclaire et se relie en doré, le reste s'efface.</p></aside>
</main>

26-11-21T11:30", "texte": "Un lycéen brillant et désœuvré ramasse un cahier tombé du ciel : quiconque y voit son nom inscrit meurt. Le cahier appartient à un dieu de la mort qui s'ennuie et qui suit désormais le garçon, en spectateur amusé. Persuadé de pouvoir purifier le monde, le lycéen commence à éliminer les criminels un par un. Une partie de l'opinion publique fait de lui une figure de justice anonyme.\n\nFace à lui se dresse un détective excentrique et génial, qui comprend vite que le tueur est quelqu'un de proche de l'enquête. Commence alors un duel d'intelligence où chacun tend des pièges à l'autre sans jamais pouvoir frapper le premier. Le lycéen infiltre l'enquête qui le traque, et le détective le soupçonne sans pouvoir le prouver.\n\nLa singularité de l'œuvre tient à son affrontement presque entièrement mental : les batailles sont des raisonnements, des règles exploitées, des alibis construits. Au fil des tomes, le récit pose la question de ce que devient un idéaliste qui s'accorde le droit de tuer, et le héros se transforme peu à peu en ce qu'il prétendait combattre.", "fichier": "gisements/death-note.md", "ordre": 0}, {"id": "dr-stone", "titre": "Dr. Stone", "auteurs": ["Riichiro Inagaki", "Boichi"], "annee": 2017, "genres": ["aventure", "science-fiction", "post-apocalyptique"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Un éclair mystérieux pétrifie l'humanité entière en un instant. Des millénaires plus tard, un adolescent passionné de sciences se libère de sa gangue de pierre. Il découvre un monde rendu à la forêt, où ne subsistent ni villes ni machines. Il se fixe un objectif démesuré : reconstruire toute la civilisation, du feu jusqu'aux technologies modernes, en ne partant de rien.\n\nIl trouve rapidement un moyen de libérer d'autres pétrifiés. Mais un jeune homme d'une force redoutable préfère un monde sans technologie, débarrassé des adultes qui l'ont corrompu. Deux visions s'affrontent : un royaume de la science qui grandit invention après invention, et un empire fondé sur la force.\n\nL'originalité de la série vient de son moteur : chaque chapitre est une étape de fabrication concrète, du savon à la radio, avec les erreurs, les matières premières à trouver et les étapes intermédiaires. La science y devient une épopée collective. Le héros recrute plus qu'il ne combat, et la série célèbre sans cynisme la joie de comprendre et de construire.", "fichier": "gisements/dr-stone.md", "ordre": 1}, {"id": "gloutons-et-dragons", "titre": "Gloutons & Dragons", "auteurs": ["Ryoko Kui"], "annee": 2014, "genres": ["fantasy", "cuisine", "comédie"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Un groupe d'aventuriers est mis en déroute au fond d'un donjon par un dragon rouge. Celui-ci avale la sœur du chef du groupe juste avant qu'un sort ne renvoie les autres à la surface. Il faut la sauver avant que le dragon ne la digère, mais le groupe a tout perdu, y compris son argent. Le chef décide donc de redescendre sans provisions et de se nourrir des monstres rencontrés en chemin.\n\nIls sont rejoints par un nain qui cuisine les créatures du donjon depuis des années. Chaque chapitre devient une recette : scorpions géants, plantes carnivores, armures animées dont on découvre qu'elles sont des colonies de mollusques… Le donjon y est pensé comme un écosystème cohérent, avec ses prédateurs, ses proies et ses règles biologiques.\n\nSous la comédie culinaire, l'œuvre construit un monde d'une profondeur rare : la nature réelle du donjon, la magie interdite qui permet de ressusciter les morts, et les désirs qui consument ceux qui cherchent le pouvoir. Ce qu'on mange, ce qu'on sacrifie et ce qu'on désire y forment le cœur d'une fantasy à la fois chaleureuse et vertigineuse.", "fichier": "gisements/gloutons-et-dragons.md", "ordre": 2}, {"id": "hikaru-no-go", "titre": "Hikaru no Go", "auteurs": ["Yumi Hotta", "Takeshi Obata"], "annee": 1998, "genres": ["jeu", "sport", "surnaturel"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Un collégien turbulent fouille le grenier de son grand-père et tombe sur un vieux goban, le plateau du jeu de go. Il réveille l'esprit d'un joueur de l'ère Heian, mort depuis un millénaire et animé d'un seul désir : atteindre le coup divin. Seul l'adolescent peut voir et entendre ce fantôme, qui le supplie de jouer pour lui.\n\nD'abord indifférent, le garçon pose les pierres que l'esprit lui dicte. Il bat ainsi un enfant prodige, fils d'un grand maître, qui en fait aussitôt son rival obsessionnel. Piqué au vif, le héros se met à apprendre lui-même. Il passe par les clubs scolaires, les écoles d'aspirants, puis le monde professionnel, jusqu'à ce que son propre jeu commence à éclipser celui de son fantôme.\n\nLa série a rendu le go populaire auprès de toute une génération. Elle raconte une passion qui grandit, une rivalité qui façonne deux joueurs, et une transmission : que reste-t-il d'un maître quand l'élève n'a plus besoin de lui ? Le dernier arc, autour de la disparition du fantôme, lui donne une profondeur inattendue.", "fichier": "gisements/hikaru-no-go.md", "ordre": 3}, {"id": "kaiji", "titre": "Kaiji", "auteurs": ["Nobuyuki Fukumoto"], "annee": 1996, "genres": ["jeu", "thriller", "psychologique"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Un jeune homme sans emploi passe ses journées à boire et à commettre de petites bassesses. Un jour, on vient lui réclamer une dette énorme qu'il a contractée en se portant garant pour un ami. On lui propose une seule issue : monter à bord d'un bateau où se tient une nuit de jeu. Les gagnants effacent leurs dettes, les perdants disparaissent.\n\nLes jeux sont simples en apparence, comme un pierre-feuille-ciseaux avec des cartes ou un pont suspendu au-dessus du vide. Mais chacun est un piège, conçu par une organisation de riches qui parie sur la souffrance des endettés. Le héros, lâche et maladroit dans la vie ordinaire, se révèle d'une lucidité stupéfiante lorsqu'il n'a plus rien à perdre. Il apprend aussi que la confiance envers les autres joueurs est à la fois sa plus grande faiblesse et sa seule arme.\n\nL'œuvre est célèbre pour sa tension presque insoutenable : une seule partie peut s'étirer sur des chapitres entiers, au rythme des calculs et des trahisons. Derrière les jeux, c'est une critique féroce d'un système qui fait payer aux plus faibles les fantasmes des plus riches.", "fichier": "gisements/kaiji.md", "ordre": 4}, {"id": "monster", "titre": "Monster", "auteurs": ["Naoki Urasawa"], "annee": 1994, "genres": ["thriller", "policier", "psychologique"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Dans les années 1980, un brillant neurochirurgien japonais travaille dans un hôpital allemand. Un soir, il désobéit à sa hiérarchie pour opérer un jeune garçon blessé par balle plutôt que le maire de la ville. Il sauve l'enfant, mais sa carrière s'effondre. Peu après, ses supérieurs meurent empoisonnés, et l'enfant disparaît.\n\nNeuf ans plus tard, le chirurgien comprend que le garçon qu'il a sauvé est devenu un tueur d'une intelligence et d'une froideur absolues. Accusé à tort des meurtres, il prend la fuite. Il s'est juré de tuer de ses mains celui qu'il a ramené à la vie. Sa traque le mène à travers l'Allemagne et l'Europe centrale de l'après-guerre froide, sur les traces d'orphelinats où l'on fabriquait des enfants sans humanité.\n\nL'œuvre tient en haleine par sa lenteur maîtrisée : des dizaines de personnages secondaires, chacun abîmé, croisent la route du héros. Elle interroge la valeur égale de chaque vie, la nature du mal et ce qu'on doit faire quand sa propre bonté a libéré un monstre.", "fichier": "gisements/monster.md", "ordre": 5}, {"id": "mushishi", "titre": "Mushishi", "auteurs": ["Yuki Urushibara"], "annee": 1999, "genres": ["fantastique", "contemplatif", "surnaturel"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Dans un Japon rural indéfini, entre l'époque d'Edo et l'ère Meiji, existent des êtres plus primitifs que les animaux ou les plantes. Ce sont des formes de vie à la frontière de la matière, invisibles pour la plupart des gens. Ils provoquent parfois d'étranges phénomènes : une surdité qui fait entendre l'inaudible, une pluie de lumière, des rêves qui débordent sur la réalité.\n\nUn homme aux cheveux blancs, fumeur et solitaire, parcourt les villages pour étudier ces créatures et soigner ceux qu'elles affectent. Il ne les combat pas : il cherche l'équilibre, rappelant que ces êtres ne font que vivre selon leur nature.\n\nChaque chapitre est une histoire presque indépendante, un village, une famille, un phénomène, que le voyageur démêle avant de reprendre la route. Le charme de l'œuvre tient à son rythme lent, à ses paysages de montagne et de brume, et à sa vision d'une nature indifférente plutôt que cruelle. Les fins sont souvent douces-amères, et le voyageur porte lui-même un passé effacé, lié aux créatures qu'il étudie.", "fichier": "gisements/mushishi.md", "ordre": 6}, {"id": "planetes", "titre": "Planetes", "auteurs": ["Makoto Yukimura"], "annee": 1999, "genres": ["science-fiction", "drame", "travail"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Vers 2070, l'humanité exploite la Lune et prépare ses premiers voyages lointains. Mais l'orbite terrestre est encombrée de débris, et un simple boulon lancé à pleine vitesse peut détruire un vaisseau. Une petite équipe d'éboueurs de l'espace les ramasse : un travail dangereux, mal payé et méprisé.\n\nLe récit suit un jeune homme de cette équipe, cynique en apparence, qui rêve de posséder un jour son propre vaisseau. Il veut faire partie de la première expédition vers Jupiter, et il est prêt à tout sacrifier pour ça. À ses côtés, une nouvelle recrue naïve et généreuse affirme que l'amour est la seule réponse à tout, ce qui l'agace profondément.\n\nLa série se distingue par son réalisme scientifique   h += `</div></div>`;
  etagesEl.innerHTML = h;
  etagesEl.querySelectorAll("[data-k]").forEach(el => el.addEventListener("click", () => choisir(el.dataset.k)));
  if (choix && etagesEl.querySelector(`[data-k="${CSS.escape(choix)}"]`)) surligner(); else effacer();
}

function liens(k) {
  const [genre, id, ty] = k.split(":"); const aretes = [];
  if (genre === "a") for (const [t, g] of Object.entries(ass[id].recette)) { aretes.push([k, `p:${g}:${t}`]); aretes.push([`p:${g}:${t}`, "g:" + g]); }
  if (genre === "g" && visible(tas[id])) for (const t of TYPES) { aretes.push([`p:${id}:${t}`, k]); for (const a of utilisations(id, t)) aretes.push(["a:" + a, `p:${id}:${t}`]); }
  if (genre === "p") { aretes.push([k, "g:" + id]); for (const a of utilisations(id, ty)) aretes.push(["a:" + a, k]); }
  return aretes;
}

function effacer() { choix = null; svg.innerHTML = ""; etagesEl.classList.remove("attenue"); etagesEl.querySelectorAll(".choisi").forEach(x => x.classList.remove("choisi")); }

function surligner() {
  const aretes = liens(choix);
  const lies = new Set([choix, ...aretes.flat()]);
  etagesEl.classList.add("attenue");
  etagesEl.querySelectorAll("[data-k]").forEach(el => { el.classList.toggle("lie", lies.has(el.dataset.k)); el.classList.toggle("choisi", el.dataset.k === choix); });
  const base = document.getElementById("batiment").getBoundingClientRect();
  svg.setAttribute("width", base.width); svg.setAttribute("height", base.height);
  const point = (k, bas) => { const el = etagesEl.querySelector(`[data-k="${CSS.escape(k)}"]`); if (!el) return null;
    const r = el.getBoundingClientRect(); return [r.left - base.left + r.width / 2, (bas ? r.bottom : r.top) - base.top]; };
  svg.innerHTML = aretes.map(([haut, bas]) => {
    const a = point(haut, true), b = point(bas, false); if (!a || !b) return "";
    const my = (a[1] + b[1]) / 2;
    return `<path d="M${a[0]} ${a[1]} C${a[0]} ${my} ${b[0]} ${my} ${b[0]} ${b[1]}" fill="none" stroke="#d6a546" stroke-width="1.3" stroke-opacity=".8"/>`;
  }).join("");
}

const lienGis = g => `<span class="lien" data-k="g:${g}">${esc(gis[g].titre)}</span>`;
const lienAss = a => `<span class="lien" data-k="a:${a}">${esc(ass[a].titre)}</span>`;
function lignePiece(g, ty, avecSource) {
  const us = utilisations(g, ty);
  return `<div class="ligne-piece" style="--c:var(--${ty})" data-k="p:${g}:${ty}"><i></i><div>${esc(tas[g].pieces[ty])}
    <small>${NOM[ty]}${avecSource ? " · extraite de " + esc(gis[g].titre) : ""} · utilisée ${us.length} fois</small></div></div>`;
}

function choisir(k) {
  choix = k; const [genre, id, ty] = k.split(":"); let h = "";
  if (genre === "g") {
    const g = gis[id];
    h = `<span class="badge">Rez-de-chaussée · gisement${etoiles.has(id) ? " · ★" : ""}</span><h2>${esc(g.titre)}</h2>
      <div class="meta">${esc((g.auteurs || []).join(", "))} · ${g.annee} · ${esc((g.genres || []).join(", "))}</div><div class="texte">${md(g.texte)}</div>`;
    h += `<h3>Pièces extraites</h3>` + (visible(tas[id]) ? TYPES.map(t => lignePiece(id, t, false)).join("") : `<div class="meta">Gisement encore vierge.</div>`);
    if (g.sources && g.sources.length) h += `<h3>Sources</h3><div class="meta">${g.sources.map(s => `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s.replace(/^https?:\/\//, "").slice(0, 50))}</a>`).join("<br>")}</div>`;
  } else if (genre === "p") {
    const us = utilisations(id, ty);
    h = `<span class="badge">Réserve · pièce brute · ${NOM[ty]}</span><h2>${esc(tas[id].pieces[ty])}</h2>
      <div class="meta">Extraite du gisement ${lienGis(id)}.</div>
      <h3>Utilisée dans</h3><div class="meta">${us.length ? us.map(lienAss).join("<br>") : "Aucune œuvre pour l'instant."}</div>`;
  } else {
    const a = ass[id];
    h = `<span class="badge">Étage 2 · œuvre assemblée · ${a.id}</span><h2>${esc(a.titre)}</h2>
      <h3>Pièces utilisées</h3>${Object.entries(a.recette).map(([t, g]) => lignePiece(g, t, true)).join("")}
      <h3>L'œuvre</h3><div class="texte">${md(a.texte)}</div>`;
  }
  const fiche = document.getElementById("fiche"); fiche.innerHTML = h; fiche.scrollTop = 0;
  fiche.querySelectorAll("[data-k]").forEach(el => el.addEventListener("click", () => choisir(el.dataset.k)));
  surligner();
}

curseur.addEventListener("input", () => { limite = +curseur.value; rendre(); });
let minuterie = null;
document.getElementById("lecture").addEventListener("click", e => {
  const b = e.currentTarget;
  if (minuterie) { clearInterval(minuterie); minuterie = null; b.textContent = "▶ Timelapse"; return; }
  if (limite >= N) limite = 0;
  b.textContent = "❚❚ Pause";
  const pas = Math.max(1, Math.round(N / 150));
  minuterie = setInterval(() => {
    limite = Math.min(N, limite + pas); curseur.value = limite; rendre();
    if (limite >= N) { clearInterval(minuterie); minuterie = null; b.textContent = "▶ Timelapse"; }
  }, 110);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") effacer(); });
window.addEventListener("resize", () => { if (choix) surligner(); });
document.getElementById("pied").textContent = `Généré le ${U.genere.replace("T", " ")} · Échap pour tout désélectionner`;
rendre();
</script>
</body>
</html>
