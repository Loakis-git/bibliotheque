e critique : nettoyer un ciel du XVIIe siècle sans effacer le peintre, recoller un panneau d'azulejos tombé d'une église, défendre ses choix devant le jury de maîtres. Inês progresse vite, trop vite au goût de certains. Puis un professeur lui fait remarquer ce qu'elle refuse de voir : dans tout ce qu'elle restaure, elle s'efface parfaitement. Et l'épreuve finale du concours exige une œuvre personnelle.\n\n**Personnages**\n- **Inês Carvalho**, réparatrice-née, incapable de peindre une seule chose qui soit à elle.\n- **Mestre Abílio Sardinha**, restaurateur bourru de soixante-dix ans, qui fume dans l'atelier malgré les solvants et ne fait jamais un compliment.\n- **Duarte Vaz**, l'élève prodige, qui ne supporte aucune imperfection, ni dans les œuvres ni chez les autres, et qui tombe amoureux d'Inês sans se l'avouer.\n- **Dona Fernanda**, la logeuse du dessus, veuve bavarde qui monte le café à l'atelier pour surveiller les amours de tout le monde.\n\n**Ce qui la rend unique** : une comédie de quartier tendre et chamailleuse, où l'apprentissage d'un métier d'art devient une question intime. Peut-on passer sa vie à soigner les autres sans jamais oser laisser sa propre trace ?", "fichier": "assemblages/n2-0004.md", "ordre": 65}, {"id": "n2-0005", "titre": "Le Maître d'armes des îles", "recette": {"heros": "berserk", "mecanique": "one-piece", "conflit": "gto"}, "ajoute": "2026-11-21T12:24", "texte": "*On l'a engagé pour dresser des enfants-soldats. Il est venu pour brûler les écoles qui l'ont dressé.*\n\nAprès trente ans de guerre, un archipel battu par les tempêtes de l'Atlantique Nord a trouvé une solution à ses orphelins : les confier à l'Ordre des Tuteurs, une congrégation qui tient une école sur chaque île. Officiellement, on y élève les enfants dans la piété et le travail. En réalité, on y forme des soldats dociles, vendus aux seigneurs du continent.\n\nTormod Sgàire a grandi dans l'une de ces écoles. Il en est sorti à quinze ans avec une marque au fer sur la nuque, puis a passé vingt ans comme mercenaire. Il porte une épée de bourreau si lourde que personne d'autre ne peut la soulever. Aujourd'hui, l'Ordre le recrute comme maître d'armes itinérant, sans savoir qui il est. Il accepte. Il veut retrouver le Recteur qui l'a marqué, et détruire l'Ordre école par école.\n\nChaque arc se déroule sur une île : un directeur tyrannique, une classe d'adolescents abîmés, et un élève qui finit par monter dans sa barque. Tormod est un professeur exécrable, brutal, grossier. Mais il est le premier adulte à dire la vérité aux enfants. Le problème, c'est qu'il les entraîne lui aussi au combat, et pour sa propre guerre. À mesure que sa petite bande grossit, il ressemble de plus en plus à ce qu'il combat.\n\n**Personnages**\n- **Tormod Sgàire**, mercenaire taciturne, incapable de tendresse, mais qui n'a jamais menti à un enfant.\n- **Eilidh**, quatorze ans, première recrue, tireuse à l'arbalète, qui le suit pour apprendre à tuer le directeur de son île.\n- **Calum Rois**, élève modèle de l'Ordre, chargé d'espionner Tormod, et qui se met à douter.\n- **Le Recteur Aonghas**, vieil homme affable et pieux, sincèrement convaincu de sauver des âmes.\n\n**Ce qui la rend unique** : une épopée maritime où chaque île libérée pose la même question : un homme brisé peut-il sauver des enfants sans en faire des armes à son tour ?", "fichier": "assemblages/n2-0005.md", "ordre": 74}, {"id": "n2-0006", "titre": "Mille victoires", "recette": {"monde": "slam-dunk", "heros": "l-habitant-de-l-infini", "conflit": "gto"}, "ajoute": "2026-11-21T12:28", "texte": "*Il lui reste trois matchs à gagner avant d'avoir enfin le droit de mourir.*\n\nEn Lituanie, le basket est une religion, et les championnats lycéens remplissent des salles entières. À Kaunas, un entraîneur sans âge écume les gymnases depuis plus d'un siècle. Jonas Kairys a l'air d'avoir quarante ans. Il en a cent vingt-six.\n\nEn 1921, lors d'un match de rue, il a brisé la nuque d'un adversaire de seize ans d'un coup d'épaule volontaire. La mère du garçon, qu'on disait sorcière, lui a lancé une malédiction : il ne vieillira ni ne mourra tant qu'il n'aura pas brisé mille autres rêves de jeunesse. Jonas a compris le sens de la sentence avec le temps : chaque victoire contre une équipe lycéenne compte pour un rêve. Depuis, il entraîne des équipes d'adolescents et gagne, encore et toujours, avec une froideur parfaite. Il en est à neuf cent quatre-vingt-dix-sept.\n\nPour ses trois derniers matchs, il accepte le poste que personne ne veut : entraîneur de l'équipe d'un lycée technique de la périphérie, composée de rebuts écartés des sections sportives. Il découvre une institution pourrie. Le proviseur revend ses meilleurs élèves aux clubs, la fédération ferme les yeux sur le dopage, et des adolescents sont jetés dès qu'ils se blessent. Jonas se met, malgré lui, à défendre ses joueurs contre tout ce système.\n\nMais pour mourir, il doit gagner, et chaque victoire écrase les rêves d'autres gamins. Plus il s'attache à son équipe, moins il sait ce qu'il souhaite vraiment.\n\n**Personnages**\n- **Jonas Kairys**, entraîneur immortel, épuisé de vivre, qui n'a plus rien ressenti depuis des décennies.\n- **Rūta Mažeikaitė**, seize ans, meneuse de génie suspendue par la fédération après un contrôle antidopage truqué.\n- **Darius Stankus**, deux mètres six, terrifié par le contact physique depuis un accident.\n- **Le proviseur Petrauskas**, affable et charitable en public, marchand d'adolescents en privé.\n\n**Ce qui la rend unique** : un manga de basket où chaque victoire rapproche le héros de la mort qu'il désire. On encourage l'équipe, en sachant ce que coûtera son succès.", "fichier": "assemblages/n2-0006.md", "ordre": 83}]};</script>
<script>
const U = window.USINE;
const TYPES = U.types;
const NOM = { monde: "Monde", heros: "Héros", mecanique: "Mécanique", conflit: "Conflit", ton: "Ton" };
const gis = Object.fromEntries(U.gisements.map(g => [g.id, g]));
const tas = Object.fromEntries(U.tas.map(t => [t.gisement, t]));
const ass = Object.fromEntries(U.assemblages.map(a => [a.id, a]));
const etoiles = new Set(U.etoiles);
const PALETTE = {
  "thriller": "#7b2d2d", "policier": "#5e3a4a", "psychologique": "#6a3d5c", "surnaturel": "#4b3f7a", "fantastique": "#3e5a78",
  "contemplatif": "#3f6b68", "fantasy": "#2f6a52", "aventure": "#8a5a24", "science-fiction": "#2d5d7c", "post-apocalyptique": "#6e6a2e",
  "historique": "#7a4a2a", "drame": "#5a4636", "jeu": "#9a4a1e", "sport": "#a0611f", "cuisine": "#8f6d1f", "comédie": "#9a7a2a",
  "tranche de vie": "#5f7a3a", "travail": "#4e5d66", "romance": "#8a3e57", "horreur": "#3d2a2a", "mecha": "#4a5560", "musique": "#6a4a7a",
  "mystère": "#3d4a66", "action": "#8c3a24", "école": "#5a6e3e", "guerre": "#5c4a3a",
};
const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
const couleurGenre = g => PALETTE[g] || `hsl(${hash(g) % 360} 35% 34%)`;
const couleurGis = id => couleurGenre(((gis[id] || {}).genres || ["drame"])[0]);
const OEUVRES = ["#6b3a2a", "#2f4f5f", "#5a3b5e", "#3e5b3a", "#6a5226", "#4a3a6a", "#2f5a52", "#6a2f3e"];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const md = t => {
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/ ([?!:;»])/g, " $1").replace(/« /g, "« ");
  return t.split(/\n{2,}/).map(b => {
    let out = "", para = [], liste = [];
    const vider = () => { if (para.length) out += `<p>${para.map(inl).join("<br>")}</p>`; if (liste.length) out += "<ul>" + liste.map(x => `<li>${inl(x)}</li>`).join("") + "</ul>"; para = []; liste = []; };
    for (const x of b.trim().split("\n")) {
      if (/^\s*- /.test(x)) { if (para.length) { const l = liste; liste = []; vider(); liste = l; } liste.push(x.replace(/^\s*- /, "")); }
      else { if (liste.length) vider(); if (x.trim()) para.push(x); }
    }
    vider(); return out;
  }).join("");
};

const etagesEl = document.getElementById("etages");
const svg = document.getElementById("liens");
const curseur = document.getElementById("curseur");
const N = U.evenements.length;
curseur.max = N; curseur.value = N;
let limite = N, choix = null;
const visible = o => o && o.ordre < limite;
const utilisations = (g, t) => ((tas[g] || {}).utilisations || {})[t] ? tas[g].utilisations[t].filter(a => visible(ass[a])) : [];

function dos(k, titre, couleur, largeur, cls) {
  return `<div class="case"><div class="dos ${cls}" data-k="${k}" title="${esc(titre)}" style="width:${largeur}px;height:${84 + hash(k) % 26}px;background:${couleur}"><span>${esc(titre)}</span></div></div>`;
}

function rendre() {
  const G = U.gisements.filter(visible), T = U.tas.filter(visible), A = U.assemblages.filter(visible);
  const extraits = new Set(T.map(t => t.gisement));
  document.getElementById("compteurs").innerHTML =
    `<span class="compteur"><b>${G.length}</b> / ${U.objectif} gisements</span><span class="compteur"><b>${T.length * TYPES.length}</b> pièces</span><span class="compteur"><b>${A.length}</b> œuvres assemblées</span>`;
  const ev = U.evenements[limite - 1];
  document.getElementById("date").textContent = ev ? `${limite}/${N} · ${ev.date.replace("T", " ")}` : "rien encore";

  let h = `<div class="etage"><div class="plaque"><div class="num">Étage 2</div><div class="nom">Œuvres assemblées</div><div class="nb">${A.length}</div></div><div class="rayon">`;
  h += A.map(a => dos("a:" + a.id, a.titre, OEUVRES[hash(a.id) % OEUVRES.length], 30, "oeuvre")).join("") || `<p class="vide-rayon">Rien n'a encore été assemblé.</p>`;
  h += `</div></div>`;
  h += `<div class="etage"><div class="plaque"><div class="num">Réserve</div><div class="nom">Pièces brutes</div><div class="nb">${T.length * TYPES.length}</div></div><div class="reserve">`;
  for (const ty of TYPES) {
    h += `<div class="rangee" style="--c:var(--${ty})"><div class="lib"><i></i>${NOM[ty]}</div><div class="briques">` +
      T.map(t => `<div class="brique" data-k="p:${t.gisement}:${ty}" title="${esc(gis[t.gisement].titre)} — ${NOM[ty].toLowerCase()}"></div>`).join("") + `</div></div>`;
  }
  h += `</div></div>`;
  h += `<div class="etage"><div class="plaque"><div class="num">Rez-de-chaussée</div><div class="nom">Gisements · mangas réels</div><div class="nb">${G.length} · ${G.length - extraits.size} vierges</div></div><div class="rayon">`;
  h += G.map(g => dos("g:" + g.id, g.titre, couleurGis(g.id), 22, (extraits.has(g.id) ? "" : "vierge") + (etoiles.has(g.id) ? " etoile" : ""))).join("") || `<p class="vide-rayon">Aucun gisement.</p>`;
  h += `</div></div>`;
  etagesEl.innerHTML = h;
  etagesEl.querySelectorAll("[data-k]").forEach(el => el.addEventListener("click", () => choisir(el.dataset.k)));
  if (choix && etagesEl.querySelector(`[data-k="${CSS.escape(choix)}"]`)) surligner(); else effacer();
}

function liens(k) {
  const [genre, id, ty] = k.split(":"); const aretes = [];
  if (genre === "a") for (const [t, g] of Object.entries(ass[id].recette)) { aretes.push([k, `p:${g}:${t}`]); aretes.push([`p:${g}:${t}`, "g:" + g]); }
  if (genre === "g" && visible(tas[id])) for (const t of TYPES) { aretes.push([`p:${id}:${t}`, k]); for (const a of utilisations(id, t)) aretes.push(["a:" + a, `p:${id}:${t}`]); }
  if (genre === "p") { aretes.push([k, "g:" + id]); for (const a of utilisations(id, ty)) aretes.push(["a:" + a, k]); }
  return aretes;
}

function effacer() { choix = null; svg.innerHTML = ""; etagesEl.classList.remove("attenue"); etagesEl.querySelectorAll(".choisi").forEach(x => x.classList.remove("choisi")); }

function surligner() {
  const aretes = liens(choix);
  const lies = new Set([choix, ...aretes.flat()]);
  etagesEl.classList.add("attenue");
  etagesEl.querySelectorAll("[data-k]").forEach(el => { el.classList.toggle("lie", lies.has(el.dataset.k)); el.classList.toggle("choisi", el.dataset.k === choix); });
  const base = document.getElementById("batiment").getBoundingClientRect();
  svg.setAttribute("width", base.width); svg.setAttribute("height", base.height);
  const point = (k, bas) => { const el = etagesEl.querySelector(`[data-k="${CSS.escape(k)}"]`); if (!el) return null;
    const r = el.getBoundingClientRect(); return [r.left - base.left + r.width / 2, (bas ? r.bottom : r.top) - base.top]; };
  svg.innerHTML = aretes.map(([haut, bas]) => {
    const a = point(haut, true), b = point(bas, false); if (!a || !b) return "";
    const my = (a[1] + b[1]) / 2;
    return `<path d="M${a[0]} ${a[1]} C${a[0]} ${my} ${b[0]} ${my} ${b[0]} ${b[1]}" fill="none" stroke="#d6a546" stroke-width="1.3" stroke-opacity=".8"/>`;
  }).join("");
}

const lienGis = g => `<span class="lien" data-k="g:${g}">${esc(gis[g].titre)}</span>`;
const lienAss = a => `<span class="lien" data-k="a:${a}">${esc(ass[a].titre)}</span>`;
function lignePiece(g, ty, avecSource) {
  const us = utilisations(g, ty);
  return `<div class="ligne-piece" style="--c:var(--${ty})" data-k="p:${g}:${ty}"><i></i><div>${esc(tas[g].pieces[ty])}
    <small>${NOM[ty]}${avecSource ? " · extraite de " + esc(gis[g].titre) : ""} · utilisée ${us.length} fois</small></div></div>`;
}

function choisir(k) {
  choix = k; const [genre, id, ty] = k.split(":"); let h = "";
  if (genre === "g") {
    const g = gis[id];
    h = `<span class="badge">Rez-de-chaussée · gisement${etoiles.has(id) ? " · ★" : ""}</span><h2>${esc(g.titre)}</h2>
      <div class="meta">${esc((g.auteurs || []).join(", "))} · ${g.annee} · ${esc((g.genres || []).join(", "))}</div><div class="texte">${md(g.texte)}</div>`;
    h += `<h3>Pièces extraites</h3>` + (visible(tas[id]) ? TYPES.map(t => lignePiece(id, t, false)).join("") : `<div class="meta">Gisement encore vierge.</div>`);
    if (g.sources && g.sources.length) h += `<h3>Sources</h3><div class="meta">${g.sources.map(s => `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s.replace(/^https?:\/\//, "").slice(0, 50))}</a>`).join("<br>")}</div>`;
  } else if (genre === "p") {
    const us = utilisations(id, ty);
    h = `<span class="badge">Réserve · pièce brute · ${NOM[ty]}</span><h2>${esc(tas[id].pieces[ty])}</h2>
      <div class="meta">Extraite du gisement ${lienGis(id)}.</div>
      <h3>Utilisée dans</h3><div class="meta">${us.length ? us.map(lienAss).join("<br>") : "Aucune œuvre pour l'instant."}</div>`;
  } else {
    const a = ass[id];
    h = `<span class="badge">Étage 2 · œuvre assemblée · ${a.id}</span><h2>${esc(a.titre)}</h2>
      <h3>Pièces utilisées</h3>${Object.entries(a.recette).map(([t, g]) => lignePiece(g, t, true)).join("")}
      <h3>L'œuvre</h3><div class="texte">${md(a.texte)}</div>`;
  }
  const fiche = document.getElementById("fiche"); fiche.innerHTML = h; fiche.scrollTop = 0;
  fiche.querySelectorAll("[data-k]").forEach(el => el.addEventListener("click", () => choisir(el.dataset.k)));
  surligner();
}

curseur.addEventListener("input", () => { limite = +curseur.value; rendre(); });
let minuterie = null;
document.getElementById("lecture").addEventListener("click", e => {
  const b = e.currentTarget;
  if (minuterie) { clearInterval(minuterie); minuterie = null; b.textContent = "▶ Timelapse"; return; }
  if (limite >= N) limite = 0;
  b.textContent = "❚❚ Pause";
  const pas = Math.max(1, Math.round(N / 150));
  minuterie = setInterval(() => {
    limite = Math.min(N, limite + pas); curseur.value = limite; rendre();
    if (limite >= N) { clearInterval(minuterie); minuterie = null; b.textContent = "▶ Timelapse"; }
  }, 110);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") effacer(); });
window.addEventListener("resize", () => { if (choix) surligner(); });
document.getElementById("pied").textContent = `Généré le ${U.genere.replace("T", " ")} · Échap pour tout désélectionner`;
rendre();
</script>
</body>
</html>
