<body>
<header>
  <h1>La Bibliothèque</h1>
  <p class="sous-titre">Au rez-de-chaussée, de vrais mangas. Chacun est extrait en cinq pièces brutes, rangées dans la réserve. À l'étage, des œuvres originales assemblées à partir de trois de ces pièces.</p>
  <div class="barre">
    <div class="compteurs" id="compteurs"></div>
    <div class="temps">
      <button id="lecture">▶ Timelapse</button>
      <input type="range" id="curseur" min="0" aria-label="Moment de la construction">
      <span id="date"></span>
    </div>
  </div>
</header>
<main>
  <div id="batiment"><svg id="liens"></svg><div id="etages"></div></div>
  <aside id="fiche"><p class="vide">Choisis un livre ou une pièce. Ce qui lui est lié s'éclaire et se relie en doré, le reste s'efface.</p></aside>
</main>
<footer id="pied"></footer>

cience-fiction", "post-apocalyptique", "action"], "sources": ["https://en.wikipedia.org/wiki/Akira_(manga)"], "ajoute": "2026-11-21T12:09", "texte": "Des décennies après qu'une explosion mystérieuse a rasé Tokyo et déclenché une guerre mondiale, une nouvelle mégapole s'est élevée près du cratère. La ville est rongée par la corruption, les manifestations, le terrorisme et des bandes de jeunes motards qui s'affrontent la nuit. Lors d'une course, l'un d'eux, le plus chétif du groupe, a un accident en croisant un étrange enfant au visage de vieillard.\n\nEmmené par l'armée, il devient le sujet d'un programme secret qui expérimente sur des enfants aux pouvoirs psychiques. Ses propres pouvoirs s'éveillent, démesurés, et nourrissent sa rancœur envers le chef de sa bande, son ami d'enfance. Bientôt, il cherche à réveiller la force endormie qui a jadis détruit la ville.\n\nFresque de plus de deux mille pages, le manga a révolutionné le genre par la précision de son dessin et le souffle de ses scènes de destruction. Son adaptation au cinéma a fait découvrir le manga à l'Occident. L'œuvre explore la puissance, l'adolescence et la peur atomique d'une société qui se reconstruit sur ses ruines.", "fichier": "gisements/akira.md", "ordre": 41}, {"id": "ashita-no-joe", "titre": "Ashita no Joe", "auteurs": ["Asao Takamori", "Tetsuya Chiba"], "annee": 1968, "genres": ["sport", "drame"], "sources": ["https://en.wikipedia.org/wiki/Ashita_no_Joe"], "ajoute": "2026-11-21T12:03", "texte": "Un jeune vagabond arrive dans un bidonville de Tokyo, bagarreur, insolent et sans attaches. Un ancien boxeur borgne et alcoolique repère en lui un talent rare et décide d'en faire un champion. Mais le garçon préfère les combines, et il finit en maison de correction. C'est là qu'il rencontre un boxeur prodige, son premier véritable rival, qui va donner un sens à sa vie.\n\nDe retour dehors, il monte sur le ring et gravit les échelons. Chaque combat le transforme, et chaque adversaire lui laisse une blessure, physique ou intime. Un drame survenu pendant un combat le hante longtemps et l'oblige à se reconstruire. Il refuse pourtant toute vie tranquille, préférant se consumer entièrement dans la boxe.\n\nPubliée en pleine période de contestation, la série a été adoptée par les étudiants et les ouvriers, qui se reconnaissaient dans ce héros sans rien. Elle est célèbre pour sa fin ouverte, que les lecteurs débattent encore, et pour sa vision de la boxe comme une façon de brûler sa vie jusqu'au bout.", "fichier": "gisements/ashita-no-joe.md", "ordre": 29}, {"id": "astro-boy", "titre": "Astro Boy", "auteurs": ["Osamu Tezuka"], "annee": 1952, "genres": ["science-fiction", "aventure"], "sources": ["https://en.wikipedia.org/wiki/Astro_Boy"], "ajoute": "2026-11-21T12:00", "texte": "Dans un futur où les robots travaillent aux côtés des humains, un grand savant perd son fils dans un accident de la route. Fou de chagrin, il construit un robot à son image. Mais l'enfant mécanique ne grandit pas, et le père finit par le rejeter et le vendre à un cirque. Recueilli par un autre scientifique, bienveillant celui-là, le petit robot découvre qu'il possède une force colossale, des réacteurs dans les jambes et un cœur capable d'émotions.\n\nIl met ses pouvoirs au service des autres, humains comme machines. Il affronte des savants fous, des robots géants, des extraterrestres, mais surtout l'injustice d'un monde où les robots restent des citoyens de seconde zone, privés de droits et soupçonnés de tout.\n\nPubliée en épisodes pendant seize ans, la série a fondé une grande partie du langage du manga moderne : le découpage dynamique, les grands yeux expressifs, le récit feuilletonnant. Sous ses aventures enfantines, elle pose des questions graves sur la discrimination, la guerre et ce qui fait qu'un être mérite d'être aimé.", "fichier": "gisements/astro-boy.md", "ordre": 23}, {"id": "berserk", "titre": "Berserk", "auteurs": ["Kentaro Miura"], "annee": 1989, "genres": ["fantasy", "horreur", "action"], "sources": ["https://en.wikipedia.org/wiki/Berserk_(manga)"], "ajoute": "2026-11-21T12:16", "texte": "Dans un monde médiéval ravagé par les guerres, un mercenaire solitaire, armé d'une épée gigantesque et d'un bras mécanique, traque des démons. Il porte sur la nuque une marque qui attire chaque nuit les créatures de l'au-delà. Il est animé d'une haine féroce, dont on comprend peu à peu l'origine.\n\nUn long retour en arrière raconte sa jeunesse : une enfance brutale sur les champs de bataille, puis son entrée dans une troupe de mercenaires menée par un chef charismatique et ambitieux. Il trouve là, pour la première fois, des compagnons et un lieu où il se sent à sa place. Mais le rêve de son chef de fonder un royaume finit par le conduire à une trahison monstrueuse, qui livre toute la troupe aux démons.\n\nLa série est réputée pour son dessin d'une minutie extraordinaire et sa violence extrême. Elle est aussi une méditation sur le destin, l'amitié et la volonté humaine face à des forces qui la dépassent. Interrompue par la mort de son auteur, elle est poursuivie par ses assistants.", "fichier": "gisements/berserk.md", "ordre": 55}, {"id": "black-jack", "titre": "Black Jack", "auteurs": ["Osamu Tezuka"], "annee": 1973, "genres": ["drame", "travail"], "sources": ["https://en.wikipedia.org/wiki/Black_Jack_(manga)"], "ajoute": "2026-11-21T12:01", "texte": "Un chirurgien au visage couturé de cicatrices opère là où les autres médecins renoncent. Il n'a pas le droit d'exercer, car il refuse de se plier au système médical, et il exige des honoraires exorbitants. On le dit vénal et sans scrupules. Pourtant, derrière cette façade, il se bat avec acharnement pour chaque vie, et il lui arrive de renoncer à son salaire quand le patient le mérite à ses yeux.\n\nIl vit retiré au bord de la mer avec une étrange petite assistante qu'il a lui-même reconstituée à partir d'une tumeur. Chaque chapitre est une histoire indépendante : une maladie rare, une opération impossible, un dilemme moral. Il soigne des criminels, des animaux, des enfants, des puissants, et ne gagne pas toujours.\n\nL'auteur, diplômé de médecine, nourrit ces récits d'un vrai savoir clinique, tout en les tirant vers le conte moral. La série interroge la valeur d'une vie, les limites de la science et la façon dont l'argent et les institutions décident de qui mérite d'être sauvé.", "fichier": "gisements/black-jack.md", "ordre": 25}, {"id": "blue-period", "titre": "Blue Period", "auteurs": ["Tsubasa Yamaguchi"], "annee": 2017, "genres": ["école", "drame"], "sources": ["https://en.wikipedia.org/wiki/Blue_Period_(manga)"], "ajoute": "2026-11-21T12:36", "texte": "Un lycéen populaire, bon élève et habile en société, réussit tout ce qu'il entreprend, mais ressent un vide intérieur. Il fait ce qu'on attend de lui sans jamais savoir ce qu'il veut. Un jour, dans la salle d'arts plastiques, il est bouleversé par une toile, puis peint pour la première fois un paysage de Tokyo à l'aube. Il découvre qu'à travers la peinture, il peut enfin exprimer ce qu'il ressent.\n\nIl décide de tenter le concours d'entrée de l'université des beaux-arts de Tokyo, l'un des plus sélectifs du pays, auquel des candidats échouent plusieurs années de suite. Il doit tout apprendre : le dessin, la composition, la couleur, l'histoire de l'art. Il rencontre des camarades bien plus doués que lui, et se heurte au doute et à la peur de ne pas avoir de talent.\n\nL'autrice, elle-même diplômée de cette université, fait de la série une véritable initiation à la pratique artistique. Elle décrit avec précision les techniques et les exercices. Elle parle de vocation, de travail et de la difficulté de trouver sa propre voix.", "fichier": "gisements/blue-period.md", "ordre": 98}, {"id": "bride-stories", "titre": "Bride Stories", "auteurs": ["Kaoru Mori"], "annee": 2008, "genres": ["historique", "romance", "tranche de vie"], "sources": ["https://en.wikipedia.org/wiki/A_Bride%27s_Story"], "ajoute": "2026-11-21T12:33", "texte": "Au XIXe siècle, en Asie centrale, une jeune femme de vingt ans issue d'une tribu semi-nomade est mariée à un garçon de douze ans, membre d'une famille sédentaire installée dans une ville de la route de la soie. Experte à l'arc, au cheval et à la chasse, elle découvre la vie de sa nouvelle famille, tandis que son jeune mari apprend à la connaître. Mais son clan d'origine, qui a besoin d'une alliance, veut la reprendre.\n\nEn parallèle, un voyageur anglais venu étudier la région traverse le pays et croise d'autres jeunes femmes, d'autres mariages, d'autres coutumes : des jumelles espiègles d'un village de pêcheurs, une veuve solitaire, une jeune fille trop franche pour trouver un mari.\n\nLa série est surtout admirée pour son dessin d'une minutie exceptionnelle : broderies, bijoux, architectures, gestes quotidiens. Elle célèbre la vie ordinaire, l'artisanat et les liens familiaux, tout en montrant les tensions politiques d'une région convoitée par les empires.", "fichier": "gisements/bride-stories.md", "ordre": 92}, {"id": "chainsaw-man", "titre": "Chainsaw Man", "auteurs": ["Tatsuki Fujimoto"], "annee": 2018, "genres": ["action", "horreur", "comédie"], "sources": ["https://en.wikipedia.org/wiki/Chainsaw_Man"], "ajoute": "2026-11-21T12:34", "texte": "Dans un monde où les démons naissent des peurs humaines, un adolescent misérable rembourse les dettes de son père mort en chassant des démons pour la mafia. Son seul compagnon est un petit chien-démon doté d'une tronçonneuse sur le museau. Trahi et tué par ses employeurs, il est ramené à la vie quand le chien fusionne avec lui. Il peut désormais faire jaillir des tronçonneuses de son corps.\n\nUne femme mystérieuse et magnétique, cadre d'une organisation publique de chasseurs de démons, le recrute. Lui qui n'a jamais rien eu rêve seulement de manger à sa faim, de dormir dans un lit et d'embrasser une fille. Il enchaîne des missions sanglantes aux côtés de collègues aussi abîmés que lui, sans comprendre qu'il est l'objet d'une convoitise bien plus vaste.\n\nMélange de violence extrême, d'humour absurde et de références au cinéma, la série a bousculé les codes du manga d'action. Son héros n'a aucune grande ambition, et ses victoires coûtent souvent plus qu'elles ne rapportent. Elle parle de manipulation, de solitude et de la faim d'une vie ordinaire.", "fichier": "gisements/chainsaw-man.md", "ordre": 94}, {"id": "death-note", "titre": "Death Note", "auteurs": ["Tsugumi Ohba", "Takeshi Obata"], "annee": 2003, "genres": ["thriller", "surnaturel", "psychologique"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Un lycéen brillant et désœuvré ramasse un cahier tombé du ciel : quiconque y voit son nom inscrit meurt. Le cahier appartient à un dieu de la mort qui s'ennuie et qui suit désormais le garçon, en spectateur amusé. Persuadé de pouvoir purifier le monde, le lycéen commence à éliminer les criminels un par un. Une partie de l'opinion publique fait de lui une figure de justice anonyme.\n\nFace à lui se dresse un détective excentrique et génial, qui comprend vite que le tueur est quelqu'un de proche de l'enquête. Commence alors un duel d'intelligence où chacun tend des pièges à l'autre sans jamais pouvoir frapper le premier. Le lycéen infiltre l'enquête qui le traque, et le détective le soupçonne sans pouvoir le prouver.\n\nLa singularité de l'œuvre tient à son affrontement presque entièrement mental : les batailles sont des raisonnements, des règles exploitées, des alibis construits. Au fil des tomes, le récit pose la question de ce que devient un idéaliste qui s'accorde le droit de tuer, et le héros se transforme peu à peu en ce qu'il prétendait combattre.", "fichier": "gisements/death-note.md", "ordre": 0}, {"id": "devilman", "titre": "Devilman", "auteurs": ["Go Nagai"], "annee": 1972, "genres": ["horreur", "surnaturel", "action"], "sources": ["https://en.wikipedia.org/wiki/Devilman"], "ajoute": "2026-11-21T12:04", "texte": "Des démons, anciens maîtres de la Terre, sortent d'un long sommeil et s'apprêtent à reprendre leur domaine. Un lycéen timide et sensible apprend la vérité par son meilleur ami, un garçon brillant et inquiétant. Pour les combattre, il accepte de fusionner avec l'un d'eux. Il devient un être hybride, doté de la puissance d'un démon mais qui conserve un cœur humain.\n\nIl affronte alors des créatures de plus en plus monstrueuses. Mais la vraie menace vient bientôt des humains eux-mêmes. Quand la population découvre que les démons peuvent prendre possession de n'importe qui, la panique tourne à la chasse aux sorcières, et les gens ordinaires se livrent à des massacres pires que ceux des démons.\n\nŒuvre fondatrice du manga d'horreur, la série surprend par sa noirceur et par sa fin, d'une ampleur apocalyptique. Elle a influencé des générations d'auteurs. Sous ses combats spectaculaires, elle parle de la guerre, de la peur de l'autre, et de la facilité avec laquelle une société peut basculer dans la barbarie.", "fichier": "gisements/devilman.md", "ordre": 31}, {"id": "doraemon", "titre": "Doraemon", "auteurs": ["Fujiko F. Fujio"], "annee": 1969, "genres": ["comédie", "science-fiction"], "sources": ["https://en.wikipedia.org/wiki/Doraemon"], "ajoute": "2026-11-21T12:05", "texte": "Un écolier paresseux, maladroit et souvent martyrisé par ses camarades voit un jour surgir de son tiroir de bureau un robot en forme de chat. Il a été envoyé du XXIIe siècle par l'arrière-petit-fils du garçon, avec une mission : changer le cours de sa vie, promise à la misère et à l'échec, pour que ses descendants s'en sortent mieux.\n\nDans sa poche ventrale, le robot transporte des gadgets venus du futur : une porte qui ouvre sur n'importe quel lieu, une hélice qui permet de voler, une machine à voyager dans le temps. Chaque chapitre suit le même mouvement : l'écolier se plaint, obtient un gadget pour régler son problème, puis en abuse jusqu'à ce que tout se retourne contre lui.\n\nDestinée aux enfants, la série est devenue une icône culturelle au Japon et dans toute l'Asie. Derrière son humour et son inventivité, elle parle avec douceur de l'amitié, de l'effort et de la tentation des raccourcis. Ses longues aventures abordent aussi l'écologie et les dérives de la technologie.", "fichier": "gisements/doraemon.md", "ordre": 33}, {"id": "dr-stone", "titre": "Dr. Stone", "auteurs": ["Riichiro Inagaki", "Boichi"], "annee": 2017, "genres": ["aventure", "science-fiction", "post-apocalyptique"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Un éclair mystérieux pétrifie l'humanité entière en un instant. Des millénaires plus tard, un adolescent passionné de sciences se libère de sa gangue de pierre. Il découvre un monde rendu à la forêt, où ne subsistent ni villes ni machines. Il se fixe un objectif démesuré : reconstruire toute la civilisation, du feu jusqu'aux technologies modernes, en ne partant de rien.\n\nIl trouve rapidement un moyen de libérer d'autres pétrifiés. Mais un jeune homme d'une force redoutable préfère un monde sans technologie, débarrassé des adultes qui l'ont corrompu. Deux visions s'affrontent : un royaume de la science qui grandit invention après invention, et un empire fondé sur la force.\n\nL'originalité de la série vient de son moteur : chaque chapitre est une étape de fabrication concrète, du savon à la radio, avec les erreurs, les matières premières à trouver et les étapes intermédiaires. La science y devient une épopée collective. Le héros recrute plus qu'il ne combat, et la série célèbre sans cynisme la joie de comprendre et de construire.", "fichier": "gisements/dr-stone.md", "ordre": 1}, {"id": "dragon-ball", "titre": "Dragon Ball", "auteurs": ["Akira Toriyama"], "annee": 1984, "genres": ["action", "aventure", "comédie"], "sources": ["https://en.wikipedia.org/wiki/Dragon_Ball_(manga)"], "ajoute": "2026-11-21T12:11", "texte": "Un petit garçon doté d'une queue de singe et d'une force prodigieuse vit seul dans les montagnes. Il rencontre une adolescente inventive qui cherche les sept boules de cristal capables d'invoquer un dragon qui exauce un vœu. Ensemble, ils partent à l'aventure dans un monde loufoque, où cohabitent animaux qui parlent, voitures volantes et maîtres d'arts martiaux.\n\nInspiré au départ d'un grand roman classique chinois, le récit se recentre vite sur le combat. Le garçon s'entraîne auprès d'un vieux maître, participe à des tournois, se fait des amis de ses anciens rivaux. Il découvre ensuite qu'il descend d'un peuple de guerriers extraterrestres. Les adversaires deviennent de plus en plus puissants, et les combats prennent une ampleur cosmique.\n\nLa série a été l'un des plus grands succès de l'histoire du manga. Elle a fixé pour des décennies les codes du manga d'action : progression par paliers, rivaux devenus alliés, transformations, tournois. Son humour et la joie de vivre de son héros contrebalancent la démesure de ses affrontements.", "fichier": "gisements/dragon-ball.md", "ordre": 45}, {"id": "escale-a-yokohama", "titre": "Escale à Yokohama", "auteurs": ["Hitoshi Ashinano"], "annee": 1994, "genres": ["science-fiction", "contemplatif", "tranche de vie"], "sources": ["https://en.wikipedia.org/wiki/Yokohama_Kaidashi_Kik%C5%8D"], "ajoute": "2026-11-21T12:26", "texte": "Dans un futur lointain, après une catastrophe écologique, le niveau des océans a monté et l'humanité décline lentement. Il n'y a ni guerre, ni violence : seulement un monde qui se vide doucement, où la nature reprend ses droits. Sur une côte presque déserte, une androïde à l'apparence de jeune femme tient un petit café, en attendant le retour de son propriétaire, parti depuis longtemps.\n\nLes chapitres suivent son quotidien : torréfier le café, accueillir les rares clients, partir à scooter faire des courses en ville, observer le ciel. Elle croise un vieil homme, un enfant qui grandit au fil des années, d'autres androïdes, et des phénomènes étranges qui peuplent ce monde finissant.\n\nSans véritable intrigue, la série est un modèle du genre dit « apaisant ». Elle doit son charme à ses paysages, à sa lenteur et à sa mélancolie lumineuse. C'est une méditation sur le temps qui passe, sur la mémoire, et sur la beauté d'un monde qui disparaît sans drame.", "fichier": "gisements/escale-a-yokohama.md", "ordre": 77}, {"id": "frieren", "titre": "Frieren", "auteurs": ["Kanehito Yamada", "Tsukasa Abe"], "annee": 2020, "genres": ["fantasy", "contemplatif", "aventure"], "sources": ["https://en.wikipedia.org/wiki/Frieren"], "ajoute": "2026-11-21T12:35", "texte": "Le roi des démons a été vaincu par un groupe de quatre héros. Parmi eux se trouvait une magicienne elfe, pour qui ces dix années d'aventure n'ont été qu'un bref moment d'une vie de plusieurs millénaires. Cinquante ans plus tard, elle assiste aux funérailles du héros, devenu un vieil homme. Elle prend alors conscience qu'elle ne l'a jamais vraiment connu, et elle en éprouve un regret qu'elle ne s'explique pas.\n\nElle repart sur les routes, accompagnée d'une jeune apprentie, puis d'autres compagnons. Elle refait le chemin de l'ancienne quête et retrouve, d'étape en étape, les traces et les souvenirs de ses amis disparus. Elle affronte des démons, passe des examens de magie, et apprend lentement à comprendre les humains.\n\nLa série renverse le récit de fantasy classique en commençant après la victoire. Elle parle de deuil, de mémoire et du temps qui passe, avec une grande douceur et beaucoup d'humour. Son succès a été mondial, notamment grâce à son adaptation animée.", "fichier": "gisements/frieren.md", "ordre": 96}, {"id": "fruits-basket", "titre": "Fruits Basket", "auteurs": ["Natsuki Takaya"], "annee": 1998, "genres": ["romance", "surnaturel", "drame"], "sources": ["https://en.wikipedia.org/wiki/Fruits_Basket"], "ajoute": "2026-11-21T12:24", "texte": "Une lycéenne orpheline vit seule sous une tente, dans un terrain boisé, pour ne pas peser sur ses proches. Elle découvre que ce terrain appartient à une riche et ancienne famille. Recueillie par trois de ses membres, elle apprend leur secret : treize d'entre eux sont possédés par les esprits des animaux du zodiaque chinois, et se transforment en animal dès qu'une personne du sexe opposé les étreint.\n\nSa gentillesse obstinée et son écoute vont peu à peu toucher chacun des membres maudits. Tous portent des blessures profondes : parents qui les rejettent, amours impossibles, solitude. Tous sont soumis à l'autorité du chef de famille, une figure tyrannique qui les tient par la peur et par le lien de la malédiction.\n\nSous ses airs de comédie romantique, la série est l'une des plus sombres et des plus subtiles de son genre. Elle traite de la maltraitance, de l'emprise familiale et de la difficulté de s'aimer soi-même. Elle est devenue l'un des mangas pour filles les plus vendus au monde.", "fichier": "gisements/fruits-basket.md", "ordre": 72}, {"id": "fullmetal-alchemist", "titre": "Fullmetal Alchemist", "auteurs": ["Hiromu Arakawa"], "annee": 2001, "genres": ["fantasy", "aventure", "action"], "sources": ["https://en.wikipedia.org/wiki/Fullmetal_Alchemist"], "ajoute": "2026-11-21T12:28", "texte": "Dans un pays où l'alchimie est une science rigoureuse fondée sur l'échange équivalent, deux jeunes frères tentent de ressusciter leur mère morte. La transmutation tourne au désastre. L'aîné perd une jambe, puis un bras pour sauver son cadet, dont l'âme ne survit qu'attachée à une armure vide. Pour retrouver leurs corps, ils partent à la recherche de la pierre philosophale.\n\nDevenu alchimiste d'État au service de l'armée, l'aîné parcourt le pays avec son frère. Leur quête les conduit vers des vérités terribles : le secret de fabrication de la pierre, des créatures artificielles infiltrées au sommet de l'État, un massacre ethnique commis par l'armée, et un complot qui menace le pays entier.\n\nLe manga équilibre parfaitement aventure, humour et gravité. Il aborde la guerre, le génocide, la responsabilité et le deuil, autour d'un principe simple : on n'obtient rien sans rien donner en échange. Il est souvent cité comme l'un des récits les plus aboutis du manga d'aventure.", "fichier": "gisements/fullmetal-alchemist.md", "ordre": 81}, {"id": "gen-d-hiroshima", "titre": "Gen d'Hiroshima", "auteurs": ["Keiji Nakazawa"], "annee": 1973, "genres": ["historique", "guerre", "drame"], "sources": ["https://en.wikipedia.org/wiki/Barefoot_Gen"], "ajoute": "2026-11-21T12:06", "texte": "En 1945, un garçon de six ans vit à Hiroshima avec sa famille. Son père, pacifiste, s'oppose ouvertement à la guerre, ce qui vaut aux siens d'être traités en traîtres par les voisins et la police. La faim, les humiliations et la propagande rythment leur quotidien. Puis, un matin d'août, la bombe atomique détruit la ville. Le garçon voit son père et une partie de sa fratrie mourir sous les décombres de leur maison.\n\nAvec sa mère, il survit dans une ville en ruines. Il affronte les brûlures, la maladie des radiations, le marché noir et l'indifférence. Au fil des années d'après-guerre, il recueille des orphelins, se bat pour manger, et refuse obstinément de baisser la tête.\n\nInspirée de la vie de l'auteur, lui-même survivant de la bombe, l'œuvre est l'un des premiers mangas traduits largement dans le monde. Elle témoigne de l'horreur nucléaire avec une franchise rare, sans rien adoucir. Elle est aussi une charge contre le militarisme, et un hymne à la vitalité de ceux qui veulent continuer à vivre.", "fichier": "gisements/gen-d-hiroshima.md", "ordre": 35}, {"id": "ghost-in-the-shell", "titre": "Ghost in the Shell", "auteurs": ["Masamune Shirow"], "annee": 1989, "genres": ["science-fiction", "policier"], "sources": ["https://en.wikipedia.org/wiki/Ghost_in_the_Shell_(manga)"], "ajoute": "2026-11-21T12:15", "texte": "Au XXIe siècle, la plupart des humains ont un cerveau relié au réseau, et beaucoup vivent dans des corps en partie ou entièrement artificiels. Une unité secrète de la police japonaise lutte contre le cyberterrorisme. Elle est commandée sur le terrain par une femme dont le corps est entièrement cybernétique, et dont seul le cerveau est d'origine humaine.\n\nL'équipe enquête sur des piratages de cerveaux, des complots politiques et des trafics de corps. Elle se lance surtout sur la piste d'un mystérieux pirate capable de manipuler les souvenirs de ses victimes. Celui-ci se révèle être une intelligence née dans le réseau, qui revendique le statut d'être vivant.\n\nLe manga est dense, foisonnant de détails techniques, d'humour et de longues notes de l'auteur en marge des pages. Il a posé des questions devenues brûlantes : ce qu'est une conscience, ce que vaut une mémoire qu'on peut falsifier, et ce qui reste humain quand le corps et l'esprit sont des produits.", "fichier": "gisements/ghost-in-the-shell.md", "ordre": 53}, {"id": "gloutons-et-dragons", "titre": "Gloutons & Dragons", "auteurs": ["Ryoko Kui"], "annee": 2014, "genres": ["fantasy", "cuisine", "comédie"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Un groupe d'aventuriers est mis en déroute au fond d'un donjon par un dragon rouge. Celui-ci avale la sœur du chef du groupe juste avant qu'un sort ne renvoie les autres à la surface. Il faut la sauver avant que le dragon ne la digère, mais le groupe a tout perdu, y compris son argent. Le chef décide donc de redescendre sans provisions et de se nourrir des monstres rencontrés en chemin.\n\nIls sont rejoints par un nain qui cuisine les créatures du donjon depuis des années. Chaque chapitre devient une recette : scorpions géants, plantes carnivores, armures animées dont on découvre qu'elles sont des colonies de mollusques… Le donjon y est pensé comme un écosystème cohérent, avec ses prédateurs, ses proies et ses règles biologiques.\n\nSous la comédie culinaire, l'œuvre construit un monde d'une profondeur rare : la nature réelle du donjon, la magie interdite qui permet de ressusciter les morts, et les désirs qui consument ceux qui cherchent le pouvoir. Ce qu'on mange, ce qu'on sacrifie et ce qu'on désire y forment le cœur d'une fantasy à la fois chaleureuse et vertigineuse.", "fichier": "gisements/gloutons-et-dragons.md", "ordre": 2}, {"id": "golden-kamuy", "titre": "Golden Kamuy", "auteurs": ["Satoru Noda"], "annee": 2014, "genres": ["historique", "aventure", "action"], "sources": ["https://en.wikipedia.org/wiki/Golden_Kamuy"], "ajoute": "2026-11-21T12:37", "texte": "Au début du XXe siècle, juste après la guerre russo-japonaise, un vétéran surnommé l'Immortel pour sa résistance hors du commun cherche fortune à Hokkaidō, l'île du nord. Il entend parler d'un trésor en or volé au peuple aïnou. L'homme qui l'a caché, emprisonné, a tatoué la carte du trésor, en morceaux, sur la peau de ses codétenus, qui se sont depuis évadés.\n\nLe vétéran s'allie à une jeune chasseuse aïnoue, dont le père est lié à l'affaire. Ensemble, ils traquent les évadés tatoués. Mais ils ne sont pas seuls : un régiment de l'armée impériale aux ambitions politiques et un ancien chef rebelle qu'on croyait mort convoitent aussi l'or.\n\nLa série mêle western, chasse au trésor, comédie absurde et violence crue. Elle est surtout saluée pour la place qu'elle accorde à la culture aïnoue, décrite avec précision : la langue, la chasse, la cuisine, les croyances. Elle a contribué à faire mieux connaître ce peuple autochtone au Japon.", "fichier": "gisements/golden-kamuy.md", "ordre": 100}, {"id": "gto", "titre": "GTO", "auteurs": ["Tōru Fujisawa"], "annee": 1997, "genres": ["comédie", "école", "drame"], "sources": ["https://en.wikipedia.org/wiki/Great_Teacher_Onizuka"], "ajoute": "2026-11-21T12:23", "texte": "Un ancien chef de gang de motards, vingt-deux ans, sans diplôme sérieux ni manières, décide de devenir professeur. Ses motivations sont d'abord douteuses. Par un concours de circonstances, il est engagé dans un collège privé prestigieux et se voit confier la classe la plus redoutée de l'établissement, des élèves qui ont déjà fait craquer plusieurs enseignants.\n\nLes élèves lui tendent piège sur piège. Mais il ne recule devant rien pour les comprendre et les protéger : il défonce des murs, saute de toits, affronte des parents abusifs et des collègues hypocrites. Un par un, les adolescents révèlent leurs blessures, entre harcèlement, solitude, abandon et pression scolaire, et il les en sort par des méthodes aussi absurdes qu'efficaces.\n\nSuite d'une série consacrée à la jeunesse du héros, l'œuvre est une satire féroce du système éducatif japonais. Elle alterne gags outranciers et moments poignants. Elle défend une idée simple : un bon professeur est d'abord quelqu'un qui prend ses élèves au sérieux.", "fichier": "gisements/gto.md", "ordre": 70}, {"id": "gunnm", "titre": "Gunnm", "auteurs": ["Yukito Kishiro"], "annee": 1990, "genres": ["science-fiction", "action"], "sources": ["https://en.wikipedia.org/wiki/Battle_Angel_Alita"], "ajoute": "2026-11-21T12:20", "texte": "Sous une cité flottante réservée à une élite que personne ne voit jamais, s'étend une immense décharge où survivent les déshérités. Un médecin spécialiste des corps cybernétiques y fouille les ordures et trouve la tête intacte d'une jeune cyborg. Il lui donne un nouveau corps. Elle ne se souvient de rien, sauf d'un art martial redoutable qui se réveille dès qu'elle combat.\n\nPour comprendre qui elle est, elle devient chasseuse de primes, traque des criminels cybernétiques, puis s'engage dans un sport de course mortel. Elle aime, perd, meurt presque plusieurs fois et change de corps à chaque fois. Elle découvre aussi la vérité cruelle sur la cité d'en haut et sur ceux qui en descendent.\n\nMêlant action ultra-violente et mélancolie, la série est l'un des classiques du cyberpunk japonais. Elle interroge l'identité quand le corps n'est plus qu'un support, et dénonce une société qui fait vivre son élite des déchets de tous les autres. Elle a été adaptée au cinéma à Hollywood.", "fichier": "gisements/gunnm.md", "ordre": 63}, {"id": "hikaru-no-go", "titre": "Hikaru no Go", "auteurs": ["Yumi Hotta", "Takeshi Obata"], "annee": 1998, "genres": ["jeu", "sport", "surnaturel"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Un collégien turbulent fouille le grenier de son grand-père et tombe sur un vieux goban, le plateau du jeu de go. Il réveille l'esprit d'un joueur de l'ère Heian, mort depuis un millénaire et animé d'un seul désir : atteindre le coup divin. Seul l'adolescent peut voir et entendre ce fantôme, qui le supplie de jouer pour lui.\n\nD'abord indifférent, le garçon pose les pierres que l'esprit lui dicte. Il bat ainsi un enfant prodige, fils d'un grand maître, qui en fait aussitôt son rival obsessionnel. Piqué au vif, le héros se met à apprendre lui-même. Il passe par les clubs scolaires, les écoles d'aspirants, puis le monde professionnel, jusqu'à ce que son propre jeu commence à éclipser celui de son fantôme.\n\nLa série a rendu le go populaire auprès de toute une génération. Elle raconte une passion qui grandit, une rivalité qui façonne deux joueurs, et une transmission : que reste-t-il d'un maître quand l'élève n'a plus besoin de lui ? Le dernier arc, autour de la disparition du fantôme, lui donne une profondeur inattendue.", "fichier": "gisements/hikaru-no-go.md", "ordre": 3}, {"id": "jojos-bizarre-adventure", "titre": "JoJo's Bizarre Adventure", "auteurs": ["Hirohiko Araki"], "annee": 1987, "genres": ["aventure", "surnaturel", "action"], "sources": ["https://en.wikipedia.org/wiki/JoJo%27s_Bizarre_Adventure"], "ajoute": "2026-11-21T12:12", "texte": "Dans l'Angleterre victorienne, un jeune aristocrate voit son père adopter un garçon pauvre, ambitieux et cruel. La rivalité entre les deux frères adoptifs bascule dans le surnaturel quand ce dernier utilise un masque de pierre aztèque pour devenir vampire. Ce combat est le premier d'une longue saga familiale, dont chaque partie suit un nouvel héritier de la lignée, à une autre époque et dans un autre pays.\n\nAu fil des générations, le récit passe des arts martiaux respiratoires aux « Stands », des manifestations psychiques dotées de pouvoirs aussi précis qu'absurdes. Les combats deviennent de véritables énigmes : il faut comprendre la règle du pouvoir adverse et la retourner contre lui.\n\nCélèbre pour son style flamboyant, ses poses inspirées de la mode et de la sculpture, ses onomatopées et ses noms tirés de la musique pop, la série est devenue un phénomène culturel. Elle mêle horreur gothique, aventure et humour décalé, et se réinvente régulièrement, jusqu'à recommencer dans un univers parallèle.", "fichier": "gisements/jojos-bizarre-adventure.md", "ordre": 47}, {"id": "kaiji", "titre": "Kaiji", "auteurs": ["Nobuyuki Fukumoto"], "annee": 1996, "genres": ["jeu", "thriller", "psychologique"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Un jeune homme sans emploi passe ses journées à boire et à commettre de petites bassesses. Un jour, on vient lui réclamer une dette énorme qu'il a contractée en se portant garant pour un ami. On lui propose une seule issue : monter à bord d'un bateau où se tient une nuit de jeu. Les gagnants effacent leurs dettes, les perdants disparaissent.\n\nLes jeux sont simples en apparence, comme un pierre-feuille-ciseaux avec des cartes ou un pont suspendu au-dessus du vide. Mais chacun est un piège, conçu par une organisation de riches qui parie sur la souffrance des endettés. Le héros, lâche et maladroit dans la vie ordinaire, se révèle d'une lucidité stupéfiante lorsqu'il n'a plus rien à perdre. Il apprend aussi que la confiance envers les autres joueurs est à la fois sa plus grande faiblesse et sa seule arme.\n\nL'œuvre est célèbre pour sa tension presque insoutenable : une seule partie peut s'étirer sur des chapitres entiers, au rythme des calculs et des trahisons. Derrière les jeux, c'est une critique féroce d'un système qui fait payer aux plus faibles les fantasmes des plus riches.", "fichier": "gisements/kaiji.md", "ordre": 4}, {"id": "ken-le-survivant", "titre": "Ken le Survivant", "auteurs": ["Buronson", "Tetsuo Hara"], "annee": 1983, "genres": ["post-apocalyptique", "action"], "sources": ["https://en.wikipedia.org/wiki/Fist_of_the_North_Star"], "ajoute": "2026-11-21T12:14", "texte": "Après une guerre nucléaire, la Terre n'est plus qu'un désert. L'eau et la nourriture sont rares, et des bandes de pillards motorisés terrorisent les survivants. Un homme taciturne, au torse marqué de sept cicatrices, parcourt ces étendues. Il est l'héritier d'un art martial millénaire qui frappe les points vitaux du corps et fait exploser ses adversaires de l'intérieur.\n\nIl cherche la femme qu'il aime, enlevée par un rival qui lui a infligé ses cicatrices. Sur sa route, il libère des villages opprimés par des tyrans et protège des enfants orphelins. Il affronte surtout ses frères adoptifs, héritiers de la même école, et les maîtres d'une école rivale, chacun avec sa vision de la force et du pouvoir.\n\nMélange de films d'arts martiaux et de cinéma post-apocalyptique, la série est célèbre pour sa violence spectaculaire, ses phrases cultes et ses combats sanglants. Elle cache pourtant un fond très sentimental : larmes viriles, sacrifices et méchants souvent tragiques, que le héros pleure autant qu'il les combat.", "fichier": "gisements/ken-le-survivant.md", "ordre": 51}, {"id": "kitaro-le-repoussant", "titre": "Kitaro le repoussant", "auteurs": ["Shigeru Mizuki"], "annee": 1960, "genres": ["fantastique", "surnaturel", "horreur"], "sources": ["https://en.wikipedia.org/wiki/GeGeGe_no_Kitar%C5%8D"], "ajoute": "2026-11-21T12:08", "texte": "Un garçon borgne, en sandales de bois, est le dernier survivant d'un peuple de spectres. Il est né dans un cimetière, d'une mère morte, et son père ne subsiste plus que sous la forme d'un globe oculaire doté de petits bras, qui voyage dans ses cheveux ou se baigne dans un bol. Ensemble, ils errent dans un Japon où les créatures du folklore, les yōkai, vivent cachées parmi les humains.\n\nChaque épisode met en scène une rencontre avec l'une de ces créatures : esprits farceurs, monstres affamés, fantômes rancuniers. Le garçon sert souvent d'intermédiaire, protégeant les humains des yōkai malveillants, mais rappelant aussi aux humains les torts qu'ils causent à ce monde invisible.\n\nPubliée d'abord dans des manga de location, sous une forme bien plus sombre et ironique, la série est devenue au fil des années un classique pour tous les publics. Elle a fait redécouvrir à tout un pays son folklore oublié. Son auteur, ancien soldat mutilé, y mêle humour noir, mélancolie et respect pour les croyances anciennes.", "fichier": "gisements/kitaro-le-repoussant.md", "ordre": 39}, {"id": "l-attaque-des-titans", "titre": "L'Attaque des Titans", "auteurs": ["Hajime Isayama"], "annee": 2009, "genres": ["action", "fantastique", "guerre"], "sources": ["https://en.wikipedia.org/wiki/Attack_on_Titan"], "ajoute": "2026-11-21T12:32", "texte": "Depuis un siècle, les derniers humains vivent retranchés derrière trois murs gigantesques, pour se protéger de titans, des géants à forme humaine qui dévorent les hommes sans raison apparente. Un jour, un titan colossal ouvre une brèche dans le mur extérieur. Un garçon voit sa mère dévorée sous ses yeux. Il jure d'exterminer tous les titans et s'engage dans l'armée avec ses deux amis d'enfance.\n\nLors de son premier combat, il découvre qu'il peut lui-même se transformer en titan. Ce pouvoir fait de lui une arme convoitée et une menace. Les secrets s'accumulent : l'origine des titans, ce qui se trouve au-delà des murs, et la véritable nature du royaume où vivent les héros.\n\nLa série est célèbre pour ses retournements, qui renversent plusieurs fois ce que le lecteur croyait savoir. D'abord récit de survie contre des monstres, elle devient une tragédie politique sur la guerre, le racisme et le cycle de la vengeance. Elle a été l'un des grands phénomènes mondiaux du manga des années 2010.", "fichier": "gisements/l-attaque-des-titans.md", "ordre": 90}, {"id": "l-ere-des-cristaux", "titre": "L'Ère des Cristaux", "auteurs": ["Haruko Ichikawa"], "annee": 2012, "genres": ["fantastique", "science-fiction", "contemplatif"], "sources": ["https://en.wikipedia.org/wiki/Land_of_the_Lustrous"], "ajoute": "2026-11-21T12:39", "texte": "Dans un futur extrêmement lointain, une île est habitée par des êtres immortels faits de pierres précieuses. Ils n'ont pas de sexe, ne mangent pas, et peuvent être brisés puis recollés. Ils vivent sous la protection d'un maître à l'apparence de moine. Des êtres venus de la Lune les attaquent régulièrement pour les capturer et les réduire en ornements.\n\nLe plus jeune d'entre eux est aussi le plus fragile et le moins doué. Incapable de combattre, il est chargé de rédiger une encyclopédie. Décidé à se rendre utile, il vit une série de transformations : il perd des parties de son corps, qui sont remplacées par d'autres matériaux, et gagne à chaque fois des capacités nouvelles, mais aussi des souvenirs en moins. Peu à peu, il commence à douter de son maître et de ce qu'on lui a toujours raconté.\n\nDessinée dans un style épuré, la série frappe par son étrangeté et sa beauté. Elle puise dans le bouddhisme et pose des questions sur l'identité, la mémoire et le changement : à force de se transformer, reste-t-on la même personne ?", "fichier": "gisements/l-ere-des-cristaux.md", "ordre": 104}, {"id": "l-habitant-de-l-infini", "titre": "L'Habitant de l'infini", "auteurs": ["Hiroaki Samura"], "annee": 1993, "genres": ["historique", "action", "fantastique"], "sources": ["https://en.wikipedia.org/wiki/Blade_of_the_Immortal"], "ajoute": "2026-11-21T12:25", "texte": "Au Japon, à l'époque d'Edo, un samouraï déchu a tué cent hommes, dont son propre seigneur. Une vieille nonne lui a implanté des vers sacrés qui referment toutes ses blessures et le rendent immortel. Las de vivre, il a fait un pacte : il retrouvera sa mortalité lorsqu'il aura tué mille hommes malfaisants.\n\nUne adolescente vient le trouver. Ses parents ont été massacrés par une école de sabre qui veut renverser l'ordre établi des dojos, et elle veut se venger. Il accepte de devenir son garde du corps. Ensemble, ils traquent un à un les membres de l'école, tout en étant eux-mêmes pourchassés par d'autres sabreurs et par le pouvoir, qui convoite le secret de l'immortalité.\n\nLa série est célèbre pour ses combats chorégraphiés, son dessin au crayon et son mélange de violence, d'humour noir et de poésie. Elle brouille la morale : les ennemis ont souvent des raisons respectables, et la vengeance n'apporte jamais ce qu'on en attend.", "fichier": "gisements/l-habitant-de-l-infini.md", "ordre": 75}, {"id": "la-rose-de-versailles", "titre": "La Rose de Versailles", "auteurs": ["Riyoko Ikeda"], "annee": 1972, "genres": ["historique", "romance", "drame"], "sources": ["https://en.wikipedia.org/wiki/The_Rose_of_Versailles"], "ajoute": "2026-11-21T12:02", "texte": "À la fin du XVIIIe siècle, un général sans héritier mâle décide d'élever sa dernière fille comme un garçon. Devenue officière, elle est chargée de commander la garde de la jeune dauphine venue d'Autriche, future reine de France. Entre les deux femmes naît une amitié complexe, traversée par les intrigues de la cour, les scandales et l'amour interdit de la reine pour un noble suédois.\n\nÀ ses côtés se tient son ami d'enfance, fils de domestique, qui l'aime en silence depuis toujours. À mesure que la misère du peuple éclate sous ses yeux, l'héroïne remet en cause tout ce qu'on lui a appris. Elle quitte la garde royale pour un régiment de soldats ordinaires et finit par choisir son camp quand Paris se soulève.\n\nMêlant personnages historiques et inventés, la série a marqué toute une génération de lectrices. Elle raconte la Révolution française à travers des destins intimes, et pose, bien avant l'heure, la question de ce que signifie vivre libre quand on est une femme.", "fichier": "gisements/la-rose-de-versailles.md", "ordre": 27}, {"id": "le-pavillon-des-hommes", "titre": "Le Pavillon des hommes", "auteurs": ["Fumi Yoshinaga"], "annee": 2004, "genres": ["historique", "drame", "romance"], "sources": ["https://en.wikipedia.org/wiki/%C5%8Coku:_The_Inner_Chambers"], "ajoute": "2026-11-21T12:31", "texte": "Au début de l'époque d'Edo, une maladie mystérieuse frappe uniquement les jeunes hommes et en tue la grande majorité. Les femmes prennent peu à peu en charge le travail, les héritages, puis le pouvoir lui-même. Les hommes, devenus rares, sont traités comme un bien précieux qu'on prête pour assurer une descendance. Au château d'Edo, la shogun règne entourée d'un harem de jeunes hommes choisis pour leur beauté.\n\nLe récit traverse plusieurs siècles et suit les shoguns successives, chacune avec sa façon de gouverner et d'aimer. On assiste aux intrigues du pavillon intérieur, aux rivalités entre favoris et aux sacrifices exigés par la lignée. On suit aussi la lente bataille des médecins pour comprendre et vaincre la maladie, jusqu'à l'arrivée des navires occidentaux.\n\nUchronie minutieuse, la série réécrit l'histoire réelle des shoguns Tokugawa en inversant les rôles des sexes. Elle montre comment le pouvoir façonne les identités, et combien les apparences comptent pour garder un trône. Elle a reçu de nombreux prix au Japon et à l'étranger.", "fichier": "gisements/le-pavillon-des-hommes.md", "ordre": 88}, {"id": "lupin-iii", "titre": "Lupin III", "auteurs": ["Monkey Punch"], "annee": 1967, "genres": ["action", "policier", "comédie"], "sources": ["https://en.wikipedia.org/wiki/Lupin_III_(manga)"], "ajoute": "2026-11-21T12:07", "texte": "Le petit-fils d'un célèbre gentleman cambrioleur a hérité du talent familial. Désinvolte, coureur de jupons et d'une audace folle, il dérobe les trésors les mieux gardés du monde. Il est entouré d'une petite bande : un tireur d'élite laconique, un sabreur traditionnel capable de trancher n'importe quoi, et une aventurière séduisante qui le trahit dès qu'elle y trouve son intérêt.\n\nÀ ses trousses, un inspecteur obstiné a fait de sa capture le but de sa vie. Chaque histoire est un casse : déguisements, pièges, trahisons et retournements jusqu'à la dernière case. Souvent, le butin s'envole au moment même où il semblait acquis.\n\nLe manga d'origine, publié dans un magazine pour adultes, est bien plus cynique et érotique que les dessins animés qui ont rendu le personnage célèbre. Inspirée à la fois des romans de cambrioleurs et des films d'espionnage, la série mêle élégance et absurdité. Elle a fait de son héros l'une des figures les plus durables de la culture populaire japonaise.", "fichier": "gisements/lupin-iii.md", "ordre": 37}, {"id": "maison-ikkoku", "titre": "Maison Ikkoku", "auteurs": ["Rumiko Takahashi"], "annee": 1980, "genres": ["romance", "comédie", "tranche de vie"], "sources": ["https://en.wikipedia.org/wiki/Maison_Ikkoku"], "ajoute": "2026-11-21T12:13", "texte": "Dans une vieille pension délabrée de la banlieue de Tokyo vit un jeune homme qui a raté son entrée à l'université. Il prépare de nouveau ses examens, mais ses voisins excentriques l'en empêchent sans cesse : une mère de famille qui boit, une hôtesse de bar peu vêtue, et un homme mystérieux qui l'espionne par un trou dans le mur. Il s'apprête à partir quand arrive la nouvelle gérante, une jeune femme douce, dont il tombe aussitôt amoureux.\n\nIl découvre qu'elle est veuve, et qu'elle porte encore le deuil de son mari. Commence alors une longue histoire d'amour faite de malentendus, de jalousies, de rivaux encombrants et de déclarations manquées. Le récit suit les personnages sur plusieurs années, à travers les études, les petits boulots et le passage à l'âge adulte.\n\nÀ la différence des autres œuvres de son autrice, la série ne contient aucun élément surnaturel. C'est une comédie romantique ancrée dans la vie ordinaire, qui prend son temps. Elle parle avec tendresse et humour de la difficulté de grandir et d'aimer quelqu'un qui n'a pas fini d'en aimer un autre.", "fichier": "gisements/maison-ikkoku.md", "ordre": 49}, {"id": "monster", "titre": "Monster", "auteurs": ["Naoki Urasawa"], "annee": 1994, "genres": ["thriller", "policier", "psychologique"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Dans les années 1980, un brillant neurochirurgien japonais travaille dans un hôpital allemand. Un soir, il désobéit à sa hiérarchie pour opérer un jeune garçon blessé par balle plutôt que le maire de la ville. Il sauve l'enfant, mais sa carrière s'effondre. Peu après, ses supérieurs meurent empoisonnés, et l'enfant disparaît.\n\nNeuf ans plus tard, le chirurgien comprend que le garçon qu'il a sauvé est devenu un tueur d'une intelligence et d'une froideur absolues. Accusé à tort des meurtres, il prend la fuite. Il s'est juré de tuer de ses mains celui qu'il a ramené à la vie. Sa traque le mène à travers l'Allemagne et l'Europe centrale de l'après-guerre froide, sur les traces d'orphelinats où l'on fabriquait des enfants sans humanité.\n\nL'œuvre tient en haleine par sa lenteur maîtrisée : des dizaines de personnages secondaires, chacun abîmé, croisent la route du héros. Elle interroge la valeur égale de chaque vie, la nature du mal et ce qu'on doit faire quand sa propre bonté a libéré un monstre.", "fichier": "gisements/monster.md", "ordre": 5}, {"id": "mushishi", "titre": "Mushishi", "auteurs": ["Yuki Urushibara"], "annee": 1999, "genres": ["fantastique", "contemplatif", "surnaturel"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Dans un Japon rural indéfini, entre l'époque d'Edo et l'ère Meiji, existent des êtres plus primitifs que les animaux ou les plantes. Ce sont des formes de vie à la frontière de la matière, invisibles pour la plupart des gens. Ils provoquent parfois d'étranges phénomènes : une surdité qui fait entendre l'inaudible, une pluie de lumière, des rêves qui débordent sur la réalité.\n\nUn homme aux cheveux blancs, fumeur et solitaire, parcourt les villages pour étudier ces créatures et soigner ceux qu'elles affectent. Il ne les combat pas : il cherche l'équilibre, rappelant que ces êtres ne font que vivre selon leur nature.\n\nChaque chapitre est une histoire presque indépendante, un village, une famille, un phénomène, que le voyageur démêle avant de reprendre la route. Le charme de l'œuvre tient à son rythme lent, à ses paysages de montagne et de brume, et à sa vision d'une nature indifférente plutôt que cruelle. Les fins sont souvent douces-amères, et le voyageur porte lui-même un passé effacé, lié aux créatures qu'il étudie.", "fichier": "gisements/mushishi.md", "ordre": 6}, {"id": "nana", "titre": "Nana", "auteurs": ["Ai Yazawa"], "annee": 2000, "genres": ["romance", "musique", "drame"], "sources": ["https://en.wikipedia.org/wiki/Nana_(manga)"], "ajoute": "2026-11-21T12:27", "texte": "Deux jeunes femmes de vingt ans, qui portent le même prénom, se rencontrent par hasard dans un train pour Tokyo. L'une est une chanteuse punk ombrageuse et déterminée, qui veut percer avec son groupe. L'autre est une romantique naïve et dépendante, qui suit son petit ami dans la capitale. Elles finissent par partager un appartement, et une amitié intense naît entre elles.\n\nLe récit suit leurs vies sur plusieurs années : les concerts, l'ascension du groupe, la rivalité avec un groupe célèbre, les histoires d'amour, les grossesses, les trahisons. Une narration au passé, par fragments, laisse deviner que tout cela finira mal, sans dire comment.\n\nCélèbre pour son élégance graphique, son goût pour la mode et ses dialogues justes, la série a marqué toute une génération de lectrices. Elle parle de l'amitié entre femmes, de la dépendance affective et du prix des rêves. Elle est restée inachevée, interrompue par la maladie de son autrice.", "fichier": "gisements/nana.md", "ordre": 79}, {"id": "nausicaa-de-la-vallee-du-vent", "titre": "Nausicaä de la Vallée du Vent", "auteurs": ["Hayao Miyazaki"], "annee": 1982, "genres": ["post-apocalyptique", "fantasy", "aventure"], "sources": ["https://en.wikipedia.org/wiki/Nausica%C3%A4_of_the_Valley_of_the_Wind_(manga)"], "ajoute": "2026-11-21T12:10", "texte": "Mille ans après l'effondrement d'une civilisation industrielle, une forêt toxique s'étend sur la Terre. Ses spores empoisonnent l'air et des insectes géants la protègent. Les survivants vivent dans de petits royaumes à sa lisière. Dans l'un d'eux, une vallée balayée par le vent de la mer, vit une jeune princesse qui étudie en secret les plantes de la forêt et sait apaiser ses créatures.\n\nQuand une guerre éclate entre deux grands empires, la princesse est entraînée loin de chez elle. Elle traverse champs de bataille, cités en ruine et profondeurs de la forêt. Elle y découvre que cet écosystème qui terrifie les hommes est peut-être en train de purifier la terre polluée, et que le monde cache des vérités plus vertigineuses encore.\n\nPublié par intermittence pendant douze ans, le manga est bien plus vaste et plus sombre que le film qu'il a inspiré. C'est une épopée politique et écologique, qui refuse les solutions simples. Elle interroge la place de l'humanité dans la nature, la guerre, la religion et ce qu'on doit accepter pour continuer à vivre.", "fichier": "gisements/nausicaa-de-la-vallee-du-vent.md", "ordre": 43}, {"id": "nodame-cantabile", "titre": "Nodame Cantabile", "auteurs": ["Tomoko Ninomiya"], "annee": 2001, "genres": ["musique", "comédie", "romance"], "sources": ["https://en.wikipedia.org/wiki/Nodame_Cantabile"], "ajoute": "2026-11-21T12:29", "texte": "Un étudiant brillant d'un conservatoire de Tokyo, pianiste et violoniste accompli, rêve de devenir chef d'orchestre en Europe. Mais une peur panique de l'avion et de la mer le cloue au Japon. Arrogant et perfectionniste, il s'ennuie parmi ses camarades. Un jour, il découvre que sa voisine, une jeune femme désordonnée, excentrique et vivant dans un appartement couvert d'ordures, est une pianiste au talent extraordinaire.\n\nElle joue à l'oreille, sans discipline, et refuse les compétitions. Il est fasciné par son jeu, elle tombe amoureuse de lui. Il se retrouve à diriger un orchestre d'étudiants excentriques. Peu à peu, chacun pousse l'autre à progresser, jusqu'aux concours internationaux et aux scènes européennes.\n\nLa série a fait découvrir la musique classique à un large public au Japon. Elle mêle comédie loufoque et vraie connaissance du métier de musicien : les répétitions, la direction d'orchestre, l'interprétation. C'est une histoire d'amour et d'apprentissage entre deux façons opposées d'aimer la musique.", "fichier": "gisements/nodame-cantabile.md", "ordre": 84}, {"id": "one-piece", "titre": "One Piece", "auteurs": ["Eiichiro Oda"], "annee": 1997, "genres": ["aventure", "action", "comédie"], "sources": ["https://en.wikipedia.org/wiki/One_Piece"], "ajoute": "2026-11-21T12:21", "texte": "Dans un monde presque entièrement recouvert par les océans, la mort d'un roi des pirates a déclenché un âge d'or de la piraterie : avant d'être exécuté, il a révélé avoir caché un trésor légendaire. Un garçon au chapeau de paille, qui a mangé enfant un fruit maudit rendant son corps élastique, prend la mer avec un rêve simple : devenir le prochain roi des pirates.\n\nIl recrute un équipage de marginaux : un sabreur, une navigatrice voleuse, un menteur, un cuisinier, un renne médecin, et bien d'autres. Chacun a une blessure et un rêve. D'île en île, ils libèrent des peuples de tyrans, affrontent la marine et d'autres pirates, et remontent peu à peu la piste d'une histoire effacée par le gouvernement mondial.\n\nDevenue la série la plus vendue de l'histoire du manga, l'œuvre construit depuis des décennies un monde d'une richesse foisonnante. Sous son humour burlesque et ses combats spectaculaires, elle parle de liberté, d'amitié, de racisme, d'esclavage et de la manière dont les puissants réécrivent le passé.", "fichier": "gisements/one-piece.md", "ordre": 66}, {"id": "patlabor", "titre": "Patlabor", "auteurs": ["Masami Yuki"], "annee": 1988, "genres": ["mecha", "policier", "comédie"], "sources": ["https://en.wikipedia.org/wiki/Patlabor"], "ajoute": "2026-11-21T12:17", "texte": "À la fin du XXe siècle, Tokyo est un chantier gigantesque. Des robots humanoïdes, les « Labors », servent d'engins de construction, notamment pour un projet colossal dans la baie. Leur usage a aussi fait naître de nouveaux accidents et une nouvelle criminalité. La police crée donc une section spéciale, équipée de Labors de patrouille, pour les maîtriser.\n\nUne jeune recrue passionnée de robots rejoint la deuxième section, une équipe de bras cassés installée dans un hangar isolé. Elle s'attache à son robot comme à un animal de compagnie. Le récit suit le quotidien de l'unité : interventions ratées, budgets serrés, rivalités entre collègues, paperasse. Il suit aussi une confrontation de longue haleine avec une multinationale qui teste illégalement un robot de combat piloté par un enfant prodige.\n\nNé d'un collectif d'auteurs qui a aussi produit des films et des séries animées, le manga se distingue par son réalisme. Les robots géants n'y sont pas des armes héroïques, mais des machines de travail, coûteuses et fragiles. Il mêle comédie de bureau, polar et satire des grandes entreprises.", "fichier": "gisements/patlabor.md", "ordre": 57}, {"id": "planetes", "titre": "Planetes", "auteurs": ["Makoto Yukimura"], "annee": 1999, "genres": ["science-fiction", "drame", "travail"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Vers 2070, l'humanité exploite la Lune et prépare ses premiers voyages lointains. Mais l'orbite terrestre est encombrée de débris, et un simple boulon lancé à pleine vitesse peut détruire un vaisseau. Une petite équipe d'éboueurs de l'espace les ramasse : un travail dangereux, mal payé et méprisé.\n\nLe récit suit un jeune homme de cette équipe, cynique en apparence, qui rêve de posséder un jour son propre vaisseau. Il veut faire partie de la première expédition vers Jupiter, et il est prêt à tout sacrifier pour ça. À ses côtés, une nouvelle recrue naïve et généreuse affirme que l'amour est la seule réponse à tout, ce qui l'agace profondément.\n\nLa série se distingue par son réalisme scientifique et humain : la décalcification des os, la solitude, les inégalités entre pays riches et pauvres face à l'espace, le terrorisme. Sous le récit de travail se cache une réflexion sur ce que signifie appartenir à un lieu, et sur le prix d'un rêve qui exige de tout quitter.", "fichier": "gisements/planetes.md", "ordre": 7}, {"id": "sailor-moon", "titre": "Sailor Moon", "auteurs": ["Naoko Takeuchi"], "annee": 1991, "genres": ["fantastique", "romance", "action"], "sources": ["https://en.wikipedia.org/wiki/Sailor_Moon"], "ajoute": "2026-11-21T12:19", "texte": "Une collégienne de quatorze ans, maladroite, gourmande et pleurnicharde, rencontre un chat noir doué de parole. Il lui révèle qu'elle peut se transformer en guerrière, et qu'elle doit combattre les créatures qui volent l'énergie des humains. Elle découvre peu à peu d'autres jeunes filles dotées du même pouvoir, chacune liée à une planète du système solaire.\n\nLes guerrières apprennent qu'elles sont les réincarnations des gardiennes d'un ancien royaume lunaire, détruit des millénaires plus tôt, et que l'héroïne était sa princesse. Un mystérieux jeune homme masqué, lié à ce passé, croise sans cesse leur chemin. Chaque arc les oppose à un nouvel ennemi venu de l'espace, du futur ou d'autres dimensions.\n\nLa série a renouvelé le genre des jeunes filles magiques en y ajoutant des combats d'équipe, une mythologie ample et une grande histoire d'amour. Elle célèbre l'amitié entre filles et la force des héroïnes imparfaites. Elle est devenue un phénomène mondial, et un repère pour plusieurs générations de lectrices.", "fichier": "gisements/sailor-moon.md", "ordre": 61}, {"id": "slam-dunk", "titre": "Slam Dunk", "auteurs": ["Takehiko Inoue"], "annee": 1990, "genres": ["sport", "comédie", "école"], "sources": ["https://en.wikipedia.org/wiki/Slam_Dunk_(manga)"], "ajoute": "2026-11-21T12:18", "texte": "Un lycéen roux, bagarreur et vantard, vient d'essuyer sa cinquantième déception amoureuse. Quand une fille lui demande s'il aime le basket, il s'inscrit aussitôt au club de l'école pour la séduire, sans rien connaître au sport. Il découvre qu'il possède une condition physique exceptionnelle, mais tout le reste lui manque : la technique, les règles et l'humilité.\n\nIl rejoint une équipe faite de fortes têtes : un capitaine massif et exigeant, un joueur prodige et taciturne qui devient son rival, un ancien délinquant revenu au jeu. Ensemble, ils visent le championnat national. Le héros apprend chaque geste dans la douleur, du rebond au tir le plus simple, et découvre peu à peu qu'il aime vraiment ce sport.\n\nLa série a déclenché un véritable engouement pour le basket au Japon. Elle mêle une comédie irrésistible et des matchs d'une intensité rare, découpés presque seconde par seconde. Elle parle de passion, de persévérance et du prix à payer pour aller au bout de soi.", "fichier": "gisements/slam-dunk.md", "ordre": 59}, {"id": "solanin", "titre": "Solanin", "auteurs": ["Inio Asano"], "annee": 2005, "genres": ["tranche de vie", "drame", "musique"], "sources": ["https://en.wikipedia.org/wiki/Solanin"], "ajoute": "2026-11-21T12:30", "texte": "Une jeune femme sortie de l'université depuis deux ans travaille comme employée de bureau dans une entreprise qu'elle déteste. Elle vit à Tokyo avec son petit ami, illustrateur à temps partiel et guitariste d'un groupe amateur qu'il a monté avec des amis de fac. Sur un coup de tête, elle démissionne, sans savoir ce qu'elle veut faire de sa vie.\n\nElle pousse son compagnon à prendre sa musique au sérieux et à tenter sa chance. Le groupe enregistre une démo, envoie des candidatures, essuie des refus. Entre petits boulots, soirées et inquiétudes sur l'avenir, chacun se demande s'il faut abandonner ses rêves pour devenir adulte. Puis un drame bouleverse la vie de la bande.\n\nŒuvre qui a révélé son auteur, la série capte avec justesse le malaise d'une génération coincée entre la liberté des études et une vie adulte sans promesse. Son dessin mêle personnages expressifs et décors photographiques. Elle parle de deuil, de renoncement, et de la façon de continuer malgré tout.", "fichier": "gisements/solanin.md", "ordre": 86}, {"id": "spirale", "titre": "Spirale", "auteurs": ["Junji Ito"], "annee": 1998, "genres": ["horreur", "surnaturel"], "sources": ["https://en.wikipedia.org/wiki/Uzumaki"], "ajoute": "2026-11-21T12:22", "texte": "Dans une petite ville côtière brumeuse, une lycéenne remarque que le père de son petit ami devient obsédé par les spirales. Il passe ses journées à contempler des coquillages, des tourbillons d'eau, les volutes de sa soupe. Sa fascination tourne à la folie, puis à une mort effroyable. Ce n'est que le début : la ville entière est atteinte par une malédiction.\n\nChapitre après chapitre, la spirale se manifeste sous des formes toujours plus horribles. Elle s'insinue dans les cheveux d'une camarade, dans la fumée du crématorium, dans le corps de lycéens qui se transforment lentement en escargots. Les habitants qui tentent de fuir sont ramenés vers la ville, qui se change peu à peu en un gigantesque labyrinthe.\n\nConsidérée comme le chef-d'œuvre de son auteur, la série doit beaucoup à l'horreur cosmique de Lovecraft. Sa force vient de l'absurdité même de la menace : une simple forme géométrique, sans intention ni explication. L'horreur naît de l'obsession, de la contagion et de l'impossibilité d'y échapper.", "fichier": "gisements/spirale.md", "ordre": 68}, {"id": "spy-x-family", "titre": "Spy×Family", "auteurs": ["Tatsuya Endo"], "annee": 2019, "genres": ["comédie", "action"], "sources": ["https://en.wikipedia.org/wiki/Spy_%C3%97_Family"], "ajoute": "2026-11-21T12:38", "texte": "Deux pays voisins se livrent une guerre froide. Le meilleur espion de l'un d'eux reçoit une mission délicate : approcher un homme politique influent du pays adverse, qui ne se montre qu'aux cérémonies de l'école d'élite où étudie son fils. Pour y parvenir, l'espion doit fonder une famille en une semaine et faire admettre un enfant dans cette école.\n\nIl adopte une petite fille dans un orphelinat, sans savoir qu'elle peut lire dans les pensées. Il épouse une jeune employée de mairie, sans savoir qu'elle est une tueuse à gages redoutable. Chacun cache sa véritable identité aux deux autres, et seule la fillette connaît tous les secrets. Elle fait tout pour préserver cette famille qu'elle adore.\n\nLa série joue sur le comique des malentendus et des situations ordinaires vécues par des personnages extraordinaires : un entretien d'admission, un examen, un pique-nique. Derrière l'action et l'humour, elle parle avec tendresse de ce qui fait une famille, même construite sur des mensonges.", "fichier": "gisements/spy-x-family.md", "ordre": 102}, {"id": "vinland-saga", "titre": "Vinland Saga", "auteurs": ["Makoto Yukimura"], "annee": 2005, "genres": ["historique", "aventure", "drame"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Au début du XIᵉ siècle, un enfant voit son père, ancien guerrier légendaire devenu pacifiste, tomber dans un guet-apens. Il grandit au sein de la troupe de mercenaires responsable de sa mort, avec un seul but : affronter leur chef en duel loyal et le tuer. Pendant des années, il devient une arme redoutable au service de l'homme qu'il hait, dans les guerres qui opposent les royaumes du Nord pour la conquête de l'Angleterre.\n\nQuand sa vengeance lui échappe, il se retrouve vide. Vendu comme esclave dans une ferme, il doit apprendre à vivre sans haine, à travailler la terre et à regarder en face le mal qu'il a fait. Il se met alors en quête d'une terre lointaine, au-delà des mers, où l'on pourrait vivre sans guerre ni esclavage.\n\nLa série surprend par son virage : un récit de batailles devient une méditation sur la non-violence, sans renier la brutalité de son époque. Elle se demande ce que signifie être un vrai guerrier, et si l'on peut briser le cycle de la vengeance sans se renier.", "fichier": "gisements/vinland-saga.md", "ordre": 8}, {"id": "yotsuba", "titre": "Yotsuba&!", "auteurs": ["Kiyohiko Azuma"], "annee": 2003, "genres": ["tranche de vie", "comédie"], "sources": [], "generation": 0, "ajoute": "2026-11-21T11:30", "texte": "Une petite fille de cinq ans, à l'énergie inépuisable, emménage avec son père adoptif dans une ville de banlieue. Elle ne connaît presque rien du monde : ni les balançoires, ni les climatiseurs, ni les feux d'artifice. Chaque découverte devient pour elle une aventure considérable, et elle la vit avec une sincérité absolue.\n\nAutour d'elle gravitent les voisines, trois sœurs aux caractères très différents, l'ami géant et placide de son père, et les gens du quartier. Les chapitres suivent les petits événements de l'été et de l'automne : une sortie à la ferme, un orage, une journée de pêche, une cigale attrapée.\n\nL'œuvre n'a quasiment pas d'intrigue, et c'est sa force. Elle repose sur une observation fine des enfants et sur le regard bienveillant des adultes qui les entourent. Le dessin, très détaillé dans les décors, rend chaque lieu familier et lumineux. On en sort avec l'impression d'avoir redécouvert le monde ordinaire à travers des yeux neufs, et sans le moindre cynisme.", "fichier": "gisements/yotsuba.md", "ordre": 9}], "tas": [{"gisement": "akira", "extrait": "2026-11-21T12:09", "pieces": {"monde": "Une mégapole reconstruite sur un cratère, rongée par la violence et les sectes.", "heros": "Un jeune chef de bande impulsif, entraîné dans une affaire qui le dépasse.", "mecanique": "Une escalade de pouvoirs et de destructions qui ne s'arrête jamais.", "conflit": "Un ami d'enfance transformé en puissance incontrôlable.", "ton": "Frénétique, cataclysmique, urbain."}, "fichier": "tas/akira.yaml", "ordre": 42, "utilisations": {"monde": [], "heros": [ taines mises qu'il a perdues de son vivant n'ont jamais été payées, et les esprits comptent bien se servir sur son hôte.\n\n**Personnages**\n- **Kōta**, gamin maladroit qui découvre qu'il a un vrai don pour lire ce que veulent les autres, y compris les esprits.\n- **Le joueur**, fantôme élégant et menteur, qui aime Kōta comme un fils et se sert de lui comme d'un pion.\n- **Sae**, la sœur aînée de Kōta. Elle a perdu sa voix lors du premier pari du garçon, et elle ne le lui pardonne pas tout à fait.\n- **L'arbitre**, un vieux moine aveugle qui fixe les règles de chaque partie et ne prend jamais parti.\n\n**Ce qui la rend unique** : les parties ont la tension d'un thriller de jeu, mais elles se jouent contre la nature elle-même. Chaque victoire coûte quelque chose à quelqu'un, et la série ne laisse jamais oublier ce qui a été misé.", "fichier": "assemblages/n2-0001.md", "ordre": 20}, {"id": "n2-0002", "titre": "La Cantine du bout du monde", "recette": {"monde": "dr-stone", "mecanique": "gloutons-et-dragons", "ton": "yotsuba"}, "generation": 0, "ajoute": "2026-11-21T11:32", "texte": "*Chaque plat retrouvé fait revenir un morceau du monde d'avant.*\n\nDes siècles après l'effondrement, la forêt a recouvert les autoroutes et les villes ne sont plus que des collines. Les survivants vivent en petits hameaux qui ont presque tout oublié, jusqu'au goût des choses. On mange pour ne pas mourir, sans savoir qu'on pourrait faire autrement.\n\nMina tire une carriole-cuisine de hameau en hameau. Elle a hérité d'un carnet couvert de noms de plats qu'elle n'a jamais goûtés : ramen, tarte Tatin, injera, pho. À partir de la faune et de la flore mutantes, elle tente de les reconstituer. Il faut identifier les champignons qui ne tuent pas, apprivoiser les insectes géants pour leur miel, retrouver la fermentation par essais et erreurs. Chaque recette réussie ramène avec elle un fragment de culture : une fête, une chanson, un mot oublié.\n\nLa série avance au rythme d'un plat par chapitre. E
