# Pièces brutes extraites du gisement « Lupin III »
gisement: lupin-iii
extrait: 2026-11-21T12:07
pieces:
  monde: Un monde de casinos, de palaces et de coffres-forts, des capitales à l'exotisme.
  heros: Un voleur génial, désinvolte et coureur, héritier d'une lignée de cambrioleurs.
  mecanique: Un casse spectaculaire par histoire, avec trahisons et retournements.
  conflit: Le voleur insaisissable contre le policier qui consacre sa vie à l'attraper.
  ton: Désinvolte, ironique, sensuel.
